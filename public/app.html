<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}body:not(.ingelogd) .top{display:none}body:not(.ingelogd) #app{visibility:hidden}</style>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("jp-theme")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<title>justPIXIT Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: top bar with three views (Vandaag / Pipeline / Klanten) and a klantfiche with form left, fase-tijdlijn right */
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --sunk:#EEF1EC; --ink:#1E2824; --muted:#5F6C66; --line:#DCE2DD;
  --accent:#2C5A4C; --accent-ink:#FFFFFF; --accent-soft:#E2ECE7;
  --late:#B3261E; --late-soft:#FAE3E0; --warn:#9A5B00; --warn-soft:#FBEED6; --ok:#2F7D5B; --ok-soft:#E1F1E8;
  --g-gesprek:#3B67A3; --g-offerte:#A8721A; --g-ontwerp:#7550A6; --g-druk:#2F7D5B; --g-klaar:#6A746F; --g-stop:#9A5550;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A211E; --sunk:#161C19; --ink:#E5ECE8; --muted:#9AA7A1; --line:#2C3632;
  --accent:#8CC4B0; --accent-ink:#0F1A16; --accent-soft:#1F322A;
  --late:#F28B82; --late-soft:#3A1E1B; --warn:#E5AC55; --warn-soft:#352816; --ok:#7CCB9F; --ok-soft:#1B3125;
  --g-gesprek:#86A9DC; --g-offerte:#DDAE5C; --g-ontwerp:#B597E0; --g-druk:#7CCB9F; --g-klaar:#A4ADA8; --g-stop:#D89892;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A211E; --sunk:#161C19; --ink:#E5ECE8; --muted:#9AA7A1; --line:#2C3632;
  --accent:#8CC4B0; --accent-ink:#0F1A16; --accent-soft:#1F322A;
  --late:#F28B82; --late-soft:#3A1E1B; --warn:#E5AC55; --warn-soft:#352816; --ok:#7CCB9F; --ok-soft:#1B3125;
  --g-gesprek:#86A9DC; --g-offerte:#DDAE5C; --g-ontwerp:#B597E0; --g-druk:#7CCB9F; --g-klaar:#A4ADA8; --g-stop:#D89892;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.01em;cursor:pointer}
.brand small{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
a.btn{text-decoration:none}
.btn.danger{color:var(--late)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 16px;margin-bottom:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.g-gesprek{color:var(--g-gesprek)}.g-offerte{color:var(--g-offerte)}.g-ontwerp{color:var(--g-ontwerp)}.g-druk{color:var(--g-druk)}.g-klaar{color:var(--g-klaar)}.g-stop{color:var(--g-stop)}
.chip.vb{background:none;border:1px dashed var(--line);font-weight:500}
.due{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{background:var(--late-soft);color:var(--late)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.planned{background:var(--sunk);color:var(--muted)}

/* section heads */
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vhead h1{font-family:var(--f-display);font-weight:400;font-size:32px;letter-spacing:-.015em}
.vhead p{margin:4px 0 0;color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* vandaag */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:900px){.today{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel>header h2{font-size:15px;font-weight:600}
.panel>header .count{color:var(--muted);font-variant-numeric:tabular-nums}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.rows li:first-child{border-top:0}
.rows li:hover{background:var(--sunk)}
.rows .who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rows .what{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:22px 18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.stats div{background:var(--surface);padding:14px 16px}
.stats b{display:block;font-family:var(--f-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.stack{display:grid;gap:24px;align-content:start}

/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 232px;background:var(--sunk);border-radius:var(--r);padding:10px;display:grid;gap:8px}
.col h3{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;padding:2px 4px 6px}
.col h3 .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;gap:6px}
.card:hover{border-color:var(--muted)}
.card .nm{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.col .none{font-size:12px;color:var(--muted);padding:4px}
.toggle-ended{margin-top:8px}

/* klanten tabel */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0}
.tools input{flex:1 1 220px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
thead th{border-top:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}

/* klant detail */
.back{margin-bottom:12px}
.khead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}
.khead h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:-.015em;overflow-wrap:anywhere}
.khead .sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;color:var(--muted)}
.savestate{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media (max-width:960px){.detail{grid-template-columns:minmax(0,1fr)}.detail aside{order:-1}}
[hidden]{display:none!important}
.sheet>*,.detail>*{min-width:0}
.sheet{display:grid;gap:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.sec h2{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;min-width:0}
.fld textarea{resize:vertical;min-height:70px}
.fld input:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;background:var(--bg)}
.opts input{accent-color:var(--accent);margin:0}
.opts label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radiorow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;align-items:center}
@media (max-width:600px){.radiorow{grid-template-columns:1fr}}
.radiorow>span{font-size:12px;color:var(--muted);font-weight:500}
.tree{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}
@media (max-width:600px){.tree{grid-template-columns:1fr}}
.tree ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tree li{display:flex;align-items:center;gap:8px;padding:3px 0}
.tree li.l1{padding-left:22px}.tree li.l2{padding-left:44px}
.tree li.l0{font-weight:600;margin-top:6px}
.tree input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.tree li label{display:flex;gap:8px;align-items:center;cursor:pointer}
.tree input[type=text]{border:0;border-bottom:1px solid var(--line);background:none;padding:2px 4px;flex:1;min-width:0}

aside{display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:960px){aside{position:static}}
.flow{list-style:none;margin:0;padding:10px 0 6px}
.flow li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 18px;font-size:13px;position:relative}
.flow li::before{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--line)}
.flow li:first-child::before{top:50%}.flow li:last-child::before{bottom:50%}
.flow li.done::before{background:var(--accent)}
.flow li .mk{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);justify-self:center;position:relative;z-index:1}
.flow li.done .mk{background:var(--accent);border-color:var(--accent)}
.flow li.cur .mk{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.flow li.cur{font-weight:600;background:var(--accent-soft)}
.flow li.todo{color:var(--muted)}
.flow li .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400;text-align:right}
.flow li .d.plan{font-style:italic}
.flow li .d.shift{color:var(--warn);font-style:normal}
.flow li .s{grid-column:2/-1;font-size:11.5px;color:var(--muted);font-weight:400}
.flow li button{all:unset;cursor:pointer;overflow-wrap:anywhere}
.flow li button:hover{text-decoration:underline}
.flow li button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.progress{height:4px;background:var(--sunk);border-radius:2px;margin:0 18px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.dlrow{margin:6px 18px 4px;padding:10px 12px;border-radius:8px;font-size:13px;display:grid;gap:2px}
.dlrow.ok{background:var(--ok-soft)}.dlrow.ok b{color:var(--ok)}
.dlrow.bad{background:var(--late-soft)}.dlrow.bad b{color:var(--late)}
.dlrow.none{background:var(--sunk);color:var(--muted)}
.dlrow span{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:2px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--late);margin-left:7px;vertical-align:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* offerte */
.ofhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ofhead input.title{font-family:var(--f-display);font-size:20px;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;min-width:0;flex:1 1 200px}
.ofhead input.title:focus{border-bottom-color:var(--accent);outline:none}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.st-Concept{background:var(--sunk);color:var(--muted)}.st-Verstuurd{background:var(--warn-soft);color:var(--warn)}
.st-Goedgekeurd{background:var(--ok-soft);color:var(--ok)}.st-Afgewezen{background:var(--late-soft);color:var(--late)}
.lines{overflow-x:auto;margin-top:12px}
.lines table{min-width:560px}
.lines th,.lines td{padding:6px 6px;border-top:1px solid var(--line)}
.lines thead th{border-top:0}
.lines td input{width:100%;border:1px solid transparent;background:none;border-radius:6px;padding:6px 8px;min-width:0}
.lines td input:hover{border-color:var(--line)}
.lines td input:focus{border-color:var(--accent);background:var(--bg);outline:none}
.lines .num{text-align:right;font-variant-numeric:tabular-nums}
.lines td.num{white-space:nowrap}
.totals{display:grid;grid-template-columns:auto 120px;gap:4px 16px;justify-content:end;margin-top:12px;font-variant-numeric:tabular-nums}
.totals span{color:var(--muted);text-align:right}
.totals b{text-align:right}
.totals .grand{font-size:17px;font-family:var(--f-display);font-weight:600;color:var(--ink)}
.totals input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;text-align:right}
.files{display:grid;gap:6px}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;background:var(--bg)}
.file a{color:var(--ink);font-weight:600;overflow-wrap:anywhere;flex:1;min-width:0}
.file .ic{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 6px}
.file img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.ofactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nudge{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.flowfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.todo-card{padding:14px 18px;display:grid;gap:10px}
.todo-card p{margin:0}
.mail{white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px;max-height:180px;overflow:auto}
.log{list-style:none;margin:0;padding:0 18px 12px;display:grid;gap:8px;max-height:280px;overflow:auto}
.log li{font-size:13px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px}
.log li time{color:var(--muted);font-variant-numeric:tabular-nums}
.logadd{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.logadd input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

/* nieuw */
.newgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.newgrid{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.aiout{font-size:13px;color:var(--muted);min-height:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}

/* beheer */
.beheer{display:grid;gap:28px}
.beheer>section>h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin-bottom:4px}
.beheer>section>p{margin:0 0 14px;color:var(--muted);max-width:65ch}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lists .sec{padding:16px 18px;display:grid;gap:10px;align-content:start}
.lists h3{font-size:13px;font-weight:600}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items li{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 6px 4px 10px;min-width:0}
.items li span{flex:1;min-width:0;overflow-wrap:anywhere}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);width:26px;height:26px;border-radius:6px;display:inline-grid;place-items:center;font-size:14px}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn:disabled{opacity:.3;cursor:default;background:none}
.additem{display:flex;gap:6px}
.additem input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 10px}
.terms{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.terms label{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1.2fr);gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.terms label:first-child{border-top:0}
.terms b{font-weight:600}
.terms span{color:var(--muted);font-size:13px}
.terms input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:600px){.terms label{grid-template-columns:minmax(0,1fr) 72px}.terms span{grid-column:1/-1}}
.mailgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:400px){.mailgrid{grid-template-columns:1fr}}
.mailgrid .sec{display:grid;gap:8px;padding:16px 18px}
.mailgrid textarea{width:100%;min-height:200px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:10px;resize:vertical;font-size:13px;line-height:1.5}
.mailgrid .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}

/* planning tab */
.gantt{overflow-x:auto}
.gantt-in{min-width:620px;display:grid;gap:4px;position:relative}
.grow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;font-size:12.5px}
.grow .gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.grow.cur .gl{color:var(--ink);font-weight:600}.grow.done .gl{color:var(--ink)}
.gt{position:relative;height:22px;background:var(--sunk);border-radius:4px}
.gt .bar{position:absolute;top:4px;bottom:4px;border-radius:3px;background:currentColor;min-width:6px}
.gt .bar.plan{opacity:.32}
.gt .bar.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
.gt .pt{position:absolute;top:5px;width:12px;height:12px;transform:translateX(-6px) rotate(45deg);background:currentColor;border-radius:2px}
.gt .pt.plan{opacity:.4}
.vl{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px solid var(--accent);z-index:2}
.vl.dead{border-left-color:var(--late)}
.vl.event{border-left:2px dotted var(--muted)}
.axis{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;font-size:11px;color:var(--muted);height:16px}
.axis div{position:relative}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:0;border-left:2px solid var(--accent);height:12px;vertical-align:-2px;margin-right:6px;width:0}
.legend i.dead{border-left-color:var(--late)}.legend i.event{border-left-style:dotted;border-left-color:var(--muted)}
.legend b{display:inline-block;width:18px;height:8px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:0}
.legend b.plan{opacity:.32}
.ptable td,.ptable th{padding:8px 10px;vertical-align:middle}
.ptable{min-width:680px}
.ptable input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;min-width:0;width:100%}
.ptable input[type=date]{width:150px}
.ptable tr{cursor:default}
.ptable tbody tr:hover{background:none}
.ptable .muted{color:var(--muted);font-size:12px}
.stt{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.stt.done{background:var(--accent-soft);color:var(--accent)}.stt.cur{background:var(--accent);color:var(--accent-ink)}
.stt.plan{background:var(--sunk);color:var(--muted)}.stt.skip{background:none;color:var(--muted);border:1px dashed var(--line)}
.stt.late{background:var(--late-soft);color:var(--late)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
/* logboek tab */
.lgfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lgfilter button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.lgfilter button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lgmonth{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.lgmonth:first-of-type{margin-top:0}
.lgl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.lgl li{display:grid;grid-template-columns:86px 92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.lgl li:first-child{border-top:0}
.lgl time{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.lgl .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.lgl .acts{display:flex;gap:2px;opacity:.6}
.lgl li:hover .acts,.lgl li:focus-within .acts{opacity:1}
.lgl .edit{grid-column:1/-1;display:grid;gap:8px}
@media (max-width:600px){.lgl li{grid-template-columns:72px minmax(0,1fr) auto}.lgl li .sb{grid-column:2;grid-row:1}.lgl li .txt{grid-column:1/-1}.lgl li .acts{grid-column:3;grid-row:1}}
.sb{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);justify-self:start;white-space:nowrap}
.sb.telefoon{background:var(--warn-soft);color:var(--warn)}.sb.mail{color:var(--g-gesprek)}.sb.afspraak{background:var(--accent-soft);color:var(--accent)}.sb.fase{color:var(--g-ontwerp)}
@media (prefers-reduced-motion:no-preference){.card,.rows li,.btn{transition:border-color .12s,background .12s}}

  afzender:'Liesbeth\njustPIXIT',
  boeking:{actief:true,titel:'Kennismakingsgesprek',intro:'In een vrijblijvend gesprek van een uurtje bekijken we jullie wensen voor de uitnodigingen of het geboortekaartje, en hoe ik daar iets unieks van maak.',locatie:'Online via videocall, of bij mij thuis',duur:60,buffer:15,dagen:{1:true,2:true,3:true,4:true,5:false,6:false,0:false},blokken:[{van:'09:30',tot:'12:00'},{van:'19:00',tot:'21:30'}],minUren:48,maxWeken:8,geblokkeerd:[],types:['Huwelijk','Geboorte','Ander'],vragen:['Hoe hebben jullie justPIXIT gevonden?'],bevestiging:'Bedankt voor jullie aanvraag! Jullie afspraak staat vast. Ik kijk ernaar uit om jullie te leren kennen.',afzender:'Liesbeth · justPIXIT'},
  mails:{
    opvolging:'Hoi {voornaam},\n\nIk hoop dat alles goed gaat met jullie! Een tweetal weken geleden stuurde ik jullie de offerte door. Hebben jullie al de tijd gehad om ze rustig te bekijken?\n\nAls er nog vragen zijn of als jullie iets willen aanpassen, laat het gerust weten. Ik denk graag mee.\n\nWarme groetjes,\n{afzender}',
    onboarding:'Hoi {voornaam},\n\nWat fijn dat jullie voor justPIXIT kiezen! In bijlage vinden jullie het onboardingspakket en een korte vragenlijst.\n\nVan zodra ik de ingevulde vragenlijst terug heb, plan ik jullie ontwerp in en laat ik weten wanneer jullie de eerste digitale proef mogen verwachten.\n\nTot snel!\n{afzender}',
    vragenlijst:'Hoi {voornaam},\n\nEven een vriendelijke herinnering: ik heb jullie vragenlijst nog niet ontvangen. Van zodra die binnen is, kan ik jullie ontwerp inplannen.\n\nLaat gerust weten als er iets onduidelijk is!\n\nGroetjes,\n{afzender}',

let cfg=JSON.parse(JSON.stringify(DEFAULTS));
function mergeCfg(stored){const c=JSON.parse(JSON.stringify(DEFAULTS));if(!stored)return c;
  if(stored.lijsten)for(const k in c.lijsten)if(Array.isArray(stored.lijsten[k]))c.lijsten[k]=stored.lijsten[k].map(String);
  if(stored.termijnen)for(const k in c.termijnen){const n=Number(stored.termijnen[k]);if(Number.isFinite(n)&&n>=0)c.termijnen[k]=n}
  if(stored.planning)for(const k in c.planning){const n=Number(stored.planning[k]);if(Number.isFinite(n)&&n>=0)c.planning[k]=n}
  if(Number.isFinite(Number(stored.btw)))c.btw=Number(stored.btw);
  if(stored.mails)for(const k in c.mails)if(typeof stored.mails[k]==='string')c.mails[k]=stored.mails[k];
  if(typeof stored.afzender==='string')c.afzender=stored.afzender;
  if(stored.boeking&&typeof stored.boeking==='object'){const b=stored.boeking;for(const k in c.boeking){if(b[k]===undefined)continue;
    if(k==='dagen'&&typeof b.dagen==='object')c.boeking.dagen=Object.assign({},c.boeking.dagen,b.dagen);
    else if(['blokken','geblokkeerd','types','vragen'].includes(k)){if(Array.isArray(b[k]))c.boeking[k]=JSON.parse(JSON.stringify(b[k]))}

    else if(typeof b[k]==='string')c.boeking[k]=b[k]}}
  return c}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDay(new Date());
const parseDay=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return isoDay(d)};
const diffDays=(s)=>Math.round((parseDay(s)-parseDay(today()))/864e5);
const fmt=s=>{if(!s)return '—';const d=parseDay(s);return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short',year: d.getFullYear()===new Date().getFullYear()?undefined:'numeric'})};
const fmtTime=s=>(s&&s.length>10&&s.slice(11,16)!=='00:00')?s.slice(11,16):'';
const fmtDT=s=>s?fmt(s)+(fmtTime(s)?' · '+fmtTime(s):''):'—';
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

function dueLabel(s){const n=diffDays(s);if(n<0)return{c:'late',t:(-n)+' d te laat'};if(n===0)return{c:'soon',t:'vandaag'};if(n<=3)return{c:'soon',t:'over '+n+' d'};return{c:'planned',t:fmt(s)}}
function faseChip(k){const f=fase(k);return `<span class="chip g-${f.g}"><span class="dot"></span>${esc(f.l)}</span>`}

/* ---------- wat moet er gebeuren ---------- */
function mails(k){
  const v=voornaam(k.naam)||'jullie';const out={};
  for(const key in cfg.mails)out[key]=cfg.mails[key].replaceAll('{voornaam}',v).replaceAll('{afzender}',cfg.afzender).replaceAll('{naam}',(k.naam||'').replace(/^Voorbeeld\s*·\s*/,''));
  return out;
}
function actie(k){
  const fd=k.faseDatums||{}, f=k.fase;
  let a=null;
  if(f==='ingepland'){
    if(!k.kennismaking) a={t:'Plan een datum voor het kennismakingsgesprek',due:today()};

  } else if(f==='gehad'){ a={t:'Offerte versturen ('+cfg.termijnen.offerte+' d na gesprek)',due:addDays(fd.gehad||today(),cfg.termijnen.offerte)}; }

  else if(f==='opvolging'){ a={t:'Nog geen antwoord? Bel of stuur een tweede bericht',due:addDays(fd.opvolging||today(),cfg.termijnen.herhaling),mail:'opvolging'}; }
  else if(f==='goedgekeurd'){ a={t:'Vragenlijst + onboardingspack versturen, wachten op vragenlijst',due:addDays(fd.goedgekeurd||today(),cfg.termijnen.vragenlijst),mail:'onboarding',mail2:'vragenlijst'}; }
  else if(f==='ontwerp_gepland'){ a={t:'Ontwerp starten',due:k.ontwerpDatum||addDays(fd.ontwerp_gepland||today(),7)}; }
  else if(f==='ontwerp_bezig'){ a={t:'Digitale proef afwerken',due:k.deadline?addDays(k.deadline,-28):addDays(fd.ontwerp_bezig||today(),14)}; }
  else if(f==='proef_digitaal'){ a={t:'Feedback op digitale proef opvolgen',due:addDays(fd.proef_digitaal||today(),cfg.termijnen.proef),mail:'proef'}; }
  else if(f==='proefdruk'){ a={t:'Proefdruk nakijken en goedkeuren',due:addDays(fd.proefdruk||today(),cfg.termijnen.proefdruk)}; }
  else if(f==='drukwerk'){ a={t:'Drukwerk leveren',due:k.deadline||addDays(fd.drukwerk||today(),10)}; }
  else if(f==='geen_deal'&&k.herContact){ a={t:'Opnieuw contact opnemen'+(k.stopReden?' (was: '+k.stopReden.toLowerCase()+')':''),due:k.herContact}; }
  return a;
}

/* ---------- planning ---------- */
function planning(k){
  const fd=k.faseDatums||{},P=cfg.planning,T=cfg.termijnen,cur=FI[k.fase]??0,t=today();
  const steps=[['ingepland',null,0],['gehad','ingepland',0],['offerte','gehad',T.offerte],['opvolging','offerte',T.opvolging],['goedgekeurd','offerte',P.beslissing],
    ['ontwerp_gepland','goedgekeurd',T.vragenlijst],['ontwerp_bezig','ontwerp_gepland',P.wachttijdOntwerp],['proef_digitaal','ontwerp_bezig',P.ontwerpduur],
    ['proefdruk','proef_digitaal',P.feedback],['drukwerk','proefdruk',P.proefdrukDuur],['afgerond','drukwerk',P.levering]];
  const out={};
  for(const [key,prev,n] of steps){
    const idx=FI[key];
    if(idx<=cur&&k.fase!=='geen_deal'){out[key]={d:fd[key]||'',real:true,skipped:key==='opvolging'&&!fd[key]&&idx<cur};continue}
    if(k.fase==='geen_deal'){out[key]={d:fd[key]||'',real:!!fd[key]};continue}
    const ov=(k.planOverride||{})[key];
    if(ov){out[key]={d:ov,real:false,manual:true,late:ov<t};continue}
    let d;
    if(key==='gehad')d=k.kennismaking?k.kennismaking.slice(0,10):'';
    else if(key==='ontwerp_bezig'&&k.ontwerpDatum)d=k.ontwerpDatum;
    else{const base=prev&&out[prev]&&out[prev].d?out[prev].d:(k.kennismaking?k.kennismaking.slice(0,10):t);d=addDays(base,n)}
    let shift=false; if(!d)d=t; if(d<t){d=t;shift=true}
    out[key]={d,real:false,shift};
  }
  return out;
}

/* ---------- saving ---------- */
function setSave(t){const el=$('#savestate');if(el)el.textContent=t}
function queue(top){pendingTop[top]=true;clearTimeout(saveTimer);setSave('Opslaan…');saveTimer=setTimeout(flushSave,700)}
function flushSave(){clearTimeout(saveTimer);saveTimer=null;const keys=Object.keys(pendingTop);if(!keys.length||!work||!db)return;pendingTop={};
  const id=work.id;const patch={bijgewerkt:new Date().toISOString()};keys.forEach(k=>patch[k]=clone({v:work[k]}).v??'');
  const full=keys.some(k=>['faseDatums','planOverride'].includes(k));const whole=full?Object.assign(clone(work),patch):null;if(whole)delete whole.id;
  chain=chain.then(()=>full?db.doc('klanten/'+id).set(whole):db.doc('klanten/'+id).update(patch)).then(()=>{if(!saveTimer)setSave('Alles opgeslagen')},e=>{setSave('Niet opgeslagen ('+(e&&e.code||'fout')+')');});
}
async function zetFase(f,datum,opts={}){

  if(f==='geen_deal'){work.stopNa=work.fase;extra.stopNa=work.stopNa;extra.stopReden=work.stopReden||'';extra.stopToelichting=work.stopToelichting||'';extra.herContact=work.herContact||''}
  else if(work.fase==='geen_deal'){work.herContact='';extra.herContact=''}
  work.fase=f; work.faseDatums=work.faseDatums||{}; work.faseDatums[f]=t;
  work.logboek=(work.logboek||[]).concat([{d:t,t:opts.logText||('Fase → '+fase(f).l),s:'fase',ts:nowTs()}]);
  renderSide();
  chain=chain.then(()=>db.doc('klanten/'+work.id).update(Object.assign({fase:f,faseDatums:work.faseDatums,logboek:work.logboek,bijgewerkt:new Date().toISOString()},extra))).then(()=>{toast(fase(f).l);if(klantTab==='offerte'){ofMounted=false;renderOffertes()}},e=>toast('Niet opgeslagen: '+(e&&e.code)));
}

function deadlineHtml(k,plan){

    return sp>=0?`<div class="dlrow ok"><b>Haalbaar: ${sp} d speling</b><span>Volgens planning klaar op ${fmt(eind)} · deadline ${fmt(k.deadline)}</span></div>`

function rowState(k,key){const cur=FI[k.fase]??0,i=FI[key],fd=k.faseDatums||{};
  if(k.fase==='geen_deal')return fd[key]?'done':'plan';
  if(i<cur)return (key==='opvolging'&&!fd[key])?'skip':'done';if(i===cur)return 'cur';return 'plan'}
function ganttHtml(k,plan){
  const dates=PLAN_ROWS.map(r=>plan[r]&&plan[r].d).filter(Boolean).concat([k.deadline,k.datumEvent,today(),k.kennismaking&&k.kennismaking.slice(0,10)].filter(Boolean)).sort();
  if(!dates.length)return '<p class="hint">Vul de datum van het kennismakingsgesprek in om een planning te zien.</p>';
  const min=addDays(dates[0],-3),max=addDays(dates.at(-1),5);const span=(parseDay(max)-parseDay(min))||1;
  const pos=d=>Math.max(0,Math.min(100,(parseDay(d)-parseDay(min))/span*100));
  const lines=[[today(),'today'],k.deadline?[k.deadline,'dead']:null,k.datumEvent?[k.datumEvent,'event']:null].filter(Boolean).map(([d,c])=>`<span class="vl ${c}" style="left:${pos(d)}%"></span>`).join('');
  let ticks='';const m=parseDay(min);m.setDate(1);m.setMonth(m.getMonth()+1);
  while(isoDay(m)<=max){ticks+=`<span style="left:${pos(isoDay(m))}%">${m.toLocaleDateString('nl-BE',{month:'short'})}${m.getMonth()===0?' '+m.getFullYear():''}</span>`;m.setMonth(m.getMonth()+1)}
  const seq=PLAN_ROWS.filter(r=>r!=='opvolging');
  const rows=PLAN_ROWS.map(r=>{const pl=plan[r]||{},st=rowState(k,r),g=fase(r).g;if(!pl.d||st==='skip')return `<div class="grow"><span class="gl">${esc(fase(r).l)}</span><div class="gt">${lines}</div></div>`;
    let end;if(r==='opvolging')end=plan.goedgekeurd&&plan.goedgekeurd.d;else{const nx=seq[seq.indexOf(r)+1];end=nx&&plan[nx]&&plan[nx].d}
    if(st==='cur'&&end&&end<today())end=today();
    const cls=st==='done'?'':st==='cur'?'cur':'plan';
    const mark=r==='afgerond'||!end||end<=pl.d?`<i class="pt ${cls==='plan'?'plan':''}" style="left:${pos(pl.d)}%"></i>`:`<i class="bar ${cls}" style="left:${pos(pl.d)}%;width:${Math.max(.8,pos(end)-pos(pl.d))}%"></i>`;
    return `<div class="grow ${st}" title="${esc(fase(r).l)} · ${fmt(pl.d)}"><span class="gl">${esc(fase(r).l)}</span><div class="gt g-${g}">${mark}${lines}</div></div>`}).join('');
  return `<div class="gantt"><div class="gantt-in"><div class="axis"><span></span><div>${ticks}</div></div>${rows}</div></div>
   <div class="legend"><span><b></b>gedaan</span><span><b class="plan"></b>gepland</span><span><i></i>vandaag</span>${k.deadline?'<span><i class="dead"></i>deadline</span>':''}${k.datumEvent?'<span><i class="event"></i>event</span>':''}</div>`;
}
function renderPlanningTab(){
  const box=$('#tab-planning');if(!box||!work)return;
  if(box.contains(document.activeElement)&&document.activeElement.matches('input[data-fn]'))return;
  const k=work,plan=planning(k),fd=k.faseDatums||{},fn=k.faseNotities||{};
  const rows=PLAN_ROWS.map(r=>{const pl=plan[r]||{},st=rowState(k,r);
    const stt=st==='done'?'<span class="stt done">Gedaan</span>':st==='cur'?'<span class="stt cur">Nu</span>':st==='skip'?'<span class="stt skip">Overgeslagen</span>':pl.late?'<span class="stt late">Achter</span>':'<span class="stt plan">Gepland</span>';
    let dateCell='',info='';
    if(st==='done'||st==='cur'){dateCell=`<input type="date" id="fd-${r}" data-fd="${r}" value="${esc(fd[r]||'')}" aria-label="Datum ${esc(fase(r).l)}">`;info=fd[r]?(st==='cur'?'sinds '+Math.max(0,-diffDays(fd[r]))+' d':''):'geen datum'}
    else if(st==='skip'){dateCell='<span class="muted">—</span>'}
    else{dateCell=`<input type="date" id="po-${r}" data-po="${r}" value="${esc(pl.d||'')}" aria-label="Geplande datum ${esc(fase(r).l)}">`;
      const n=pl.d?diffDays(pl.d):null;info=(n===null?'':n<0?(-n)+' d geleden':n===0?'vandaag':'over '+n+' d')+(pl.manual?` · zelf ingesteld <button class="linkbtn" data-poreset="${r}">automatisch</button>`:pl.shift?' · verschoven':(r==='opvolging'?' · indien nodig':''))}
    return `<tr><td><b>${esc(fase(r).l)}</b></td><td>${stt}</td><td>${dateCell}</td><td class="muted">${info}</td><td><input id="fn-${r}" data-fn="${r}" value="${esc(fn[r]||'')}" placeholder="Notitie" aria-label="Notitie bij ${esc(fase(r).l)}"></td></tr>`}).join('');
  box.innerHTML=`<section class="sec"><h2>Tijdslijn</h2>${k.fase==='geen_deal'?'<div class="dlrow none" style="margin:0 0 12px">Dit traject is gestopt. Je ziet enkel de datums die al gebeurden.</div>':deadlineHtml(k,plan).replace('class="dlrow','style="margin:0 0 14px" class="dlrow')}${ganttHtml(k,plan)}</section>
   <section class="sec"><h2>Per fase</h2><p class="hint">Gedane fases tonen de echte datum; die kan je corrigeren. Bij komende fases kan je de geplande datum zelf aanpassen. De fases erna schuiven dan mee.</p>
    <div class="tablewrap" style="border:0"><table class="ptable"><thead><tr><th>Fase</th><th>Status</th><th>Datum</th><th>Wanneer</th><th>Notitie</th></tr></thead><tbody>${rows}</tbody></table></div></section>
   <section class="sec"><h2>Standaard doorlooptijden</h2><p class="hint" style="margin:0 0 10px">De automatische planning gebruikt: offerte ${cfg.termijnen.offerte} d na het gesprek · beslissing ${cfg.planning.beslissing} d · vragenlijst ${cfg.termijnen.vragenlijst} d · wachttijd ontwerp ${cfg.planning.wachttijdOntwerp} d · ontwerp ${cfg.planning.ontwerpduur} d · feedback ${cfg.planning.feedback} d · proefdruk ${cfg.planning.proefdrukDuur} d · levering ${cfg.planning.levering} d.</p><button class="btn small" data-v="beheer">Aanpassen in Beheer</button></section>`;
}

function logSorted(k){return (k.logboek||[]).map((l,i)=>({l,i})).sort((a,b)=>(b.l.d||'').localeCompare(a.l.d||'')||b.i-a.i)}

   <section class="sec"><div class="lgfilter"><button aria-pressed="${!logFilter}" data-lgf="">Alles ${all.length}</button>${Object.entries(LOG_SOORTEN).filter(([k])=>counts[k]).map(([k,v])=>`<button aria-pressed="${logFilter===k}" data-lgf="${k}">${v} ${counts[k]}</button>`).join('')}</div>

document.addEventListener('submit',e=>{if(e.target.id!=='logfull'||!work)return;e.preventDefault();

async function downloadUBL(ofId){
  const btn=document.querySelector(`[data-factuur="${ofId}"]`);if(btn){btn.disabled=true;btn.textContent='Bezig…'}
  flushSave();await new Promise(r=>setTimeout(r,300));
  try{const r=await fetch('/api/klant/'+work.id+'/factuur-ubl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offerteId:ofId}),credentials:'same-origin'}).then(x=>x.json());
    if(r.error){toast(r.error)}
    else{
      const blob=new Blob([r.xml],{type:'application/xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.filename||'factuur.xml';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

function apiDb(){
  let store={};const subs=[];let pending=0;
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{const o=Object.assign({},a);for(const k in b)o[k]=isObj(b[k])&&isObj(a[k])?merge(a[k],b[k]):JSON.parse(JSON.stringify(b[k]));return o};
  const snapDoc=path=>({id:path.split('/').pop(),exists:path in store,data:()=>store[path]?JSON.parse(JSON.stringify(store[path])):undefined,metadata:{fromCache:false,hasPendingWrites:pending>0}});
  const notify=()=>subs.forEach(f=>setTimeout(f,0));
  async function call(method,path,body){
    const r=await fetch('/api/'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
    if(r.status===401){showLogin();throw{code:'not_granted',message:'Niet aangemeld'}}
    if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw{code:r.status===413?'quota_exceeded':'unavailable',message:e.error||r.statusText}}
    return r.json();
  }
  async function load(){const d=await call('GET','data');store={};for(const [id,doc] of Object.entries(d.klanten||{}))store['klanten/'+id]=doc;for(const [id,doc] of Object.entries(d.instellingen||{}))store['instellingen/'+id]=doc;notify()}
  const doc=path=>({path,id:path.split('/').pop(),
    get:async()=>snapDoc(path),
    set:async d=>{store[path]=JSON.parse(JSON.stringify(d));notify();pending++;try{await call('PUT','doc/'+path,store[path])}finally{pending--}},
    update:async d=>{if(!(path in store))throw{code:'invalid_argument',message:'bestaat niet'};store[path]=merge(store[path],d);notify();pending++;try{await call('PUT','doc/'+path,store[path])}finally{pending--}},
    delete:async()=>{delete store[path];notify();await call('DELETE','doc/'+path)},
    onSnapshot:(next)=>{const f=()=>next(snapDoc(path));subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}});
  const collection=c=>({path:c,doc:id=>doc(c+'/'+(id||Math.random().toString(36).slice(2,12))),
    onSnapshot:(next)=>{const f=()=>{const docs=Object.keys(store).filter(p=>p.startsWith(c+'/')&&p.split('/').length===c.split('/').length+1).sort().map(snapDoc);next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:pending>0},docChanges:()=>[]})};subs.push(f);setTimeout(f,0);return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}}});
  // Ververs regelmatig, zodat nieuwe online boekingen verschijnen zonder herladen.
  const refresh=()=>{if(document.visibilityState==='visible'&&!pending&&!saveTimer&&!cfgTimer)load().catch(()=>{})};
  setInterval(refresh,45000);window.addEventListener('focus',refresh);
  return {doc,collection,load};
}

      if(!r.ok){let e={};try{e=await r.json()}catch(_){}throw{code:r.status===413?'too_large':r.status===415?'unsupported_type':'upstream_error',message:e.error||''}}return r.json()},

async function doeUpdate(){
  if(updateBezig)return;
  const startV=serverInfo.versie;
  const r=await fetch('/api/update',{method:'POST',credentials:'same-origin'}).then(x=>x.json()).catch(()=>({error:'Geen verbinding'}));
  if(r.error){const st=$('#updateStatus');if(st){st.style.color='var(--late)';st.textContent=r.error}return}
  updateBezig=true;laadVersiePaneel();
  // Poll tot de versie verandert (de app herstart op de nieuwe image) of tot time-out.
  let tries=0;
  const poll=async()=>{
    tries++;
    let info=null;try{info=await (await fetch('/api/version',{credentials:'same-origin'})).json()}catch(e){}
    if(info&&info.running.version!==startV){updateBezig=false;toast('Bijgewerkt naar versie '+info.running.version);laadVersiePaneel();return}
    if(tries>30){updateBezig=false;const st=$('#updateStatus');laadVersiePaneel();const s2=$('#updateStatus');if(s2){s2.style.color='var(--muted)';s2.textContent='Geen nieuwe versie geladen. Mogelijk draai je al de nieuwste, of de build is nog bezig.'}return}
    setTimeout(poll,4000);
  };
  setTimeout(poll,5000);
}

  const badge=d.actief?'<span class="stt done">Actief</span>':'<span class="stt plan">Niet ingesteld</span>';
  const html=`<section><h2>Videocall — Zoom ${badge}</h2>
    <p>Voor Zoom-meetings bij online afspraken. Maak in de Zoom App Marketplace een <b>Server-to-Server OAuth</b>-app met de scope <code>meeting:write:admin</code> en plak hieronder Account-ID, Client-ID en Client-secret. (Teams vraagt geen aparte koppeling — dat loopt via Office 365 hierboven.)</p>
    <div class="sec" style="display:grid;gap:14px"><div class="grid2">
      <label class="fld"><span>Account-ID</span><input data-zoom="accountId" value="${esc(d.accountId||'')}" autocomplete="off"></label>
      <label class="fld"><span>Client-ID</span><input data-zoom="clientId" placeholder="${d.clientIdSet?'ingesteld — laat leeg om te behouden':''}" autocomplete="off"></label>
      <label class="fld"><span>Client-secret</span><input type="password" data-zoom="clientSecret" placeholder="${d.secretSet?'ingesteld — laat leeg om te behouden':''}" autocomplete="off"></label>
     </div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn primary small" id="zoomSave">Bewaar</button><button class="btn small" id="zoomTest">Test verbinding</button>${d.actief?'<button class="btn ghost small danger" id="zoomOff">Wis</button>':''}<span class="hint" id="zoomMsg"></span></div>
     <p class="hint" style="margin:0">Zet daarna "Zoom" aan bij Beheer → Online afspraken om het aan klanten aan te bieden.</p>
    </div></section>`;
  box.insertAdjacentHTML('beforeend',html);
}
async function bewaarZoom(){const msg=$('#zoomMsg');const data={};document.querySelectorAll('[data-zoom]').forEach(i=>{if(i.type==='password'&&!i.value)return;data[i.dataset.zoom]=i.value});
  if(msg){msg.style.color='';msg.textContent='Bewaren…'}
  try{await fetch('/api/zoom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'});toast('Bewaard');koppelOpen=false;await refreshServerInfo();render()}catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Mislukt'}}
}
async function testZoom(){const msg=$('#zoomMsg');if(msg){msg.style.color='';msg.textContent='Testen…'}
  try{const r=await fetch('/api/zoom/test',{method:'POST',credentials:'same-origin'}).then(x=>x.json());if(msg){msg.style.color=r.error?'var(--late)':'var(--ok)';msg.textContent=r.error||r.detail||'In orde'}}catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Mislukt'}}
}
async function ontkoppelZoom(){try{await fetch('/api/zoom/ontkoppel',{method:'POST',credentials:'same-origin'});toast('Zoom gewist');koppelOpen=false;await refreshServerInfo();render()}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('#zoomSave,#zoomTest,#zoomOff');if(!t)return;
  if(t.id==='zoomSave')return bewaarZoom();if(t.id==='zoomTest')return testZoom();if(t.id==='zoomOff')return ontkoppelZoom();});
async function bewaarMS(){const msg=$('#msMsg');const data={};document.querySelectorAll('[data-ms]').forEach(i=>{if(i.type==='password'&&!i.value)return;data[i.dataset.ms]=i.value});
  if(msg){msg.style.color='';msg.textContent='Bewaren…'}
  try{await fetch('/api/ms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'});if(msg)msg.textContent='Bewaard. Klik nu "Verbind met Office 365".'}catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Bewaren mislukt'}}
}
async function syncMS(){const msg=$('#msMsg');if(msg){msg.style.color='';msg.textContent='Bezig…'}
  try{const r=await fetch('/api/ms/sync',{method:'POST',credentials:'same-origin'}).then(x=>x.json());if(msg){msg.style.color=r.error?'var(--late)':'var(--ok)';msg.textContent=r.error||(r.aantal+' afspraken in je agenda gezet'+(r.fouten?(' ('+r.fouten+' mislukt)'):''))}}catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Mislukt'}}
}
async function ontkoppelMS(){try{await fetch('/api/ms/ontkoppel',{method:'POST',credentials:'same-origin'});toast('Office 365 ontkoppeld');koppelOpen=false;await refreshServerInfo();render()}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('#msSave,#msSync,#msOff');if(!t)return;
  if(t.id==='msSave')return bewaarMS();if(t.id==='msSync')return syncMS();if(t.id==='msOff')return ontkoppelMS();});
async function bewaarFacturatie(){
  const msg=$('#factmsg');const data={};document.querySelectorAll('[data-fact]').forEach(i=>data[i.dataset.fact]=i.value);
  if(msg){msg.style.color='';msg.textContent='Bewaren…'}
  try{const r=await fetch('/api/facturatie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'}).then(x=>x.json());
    if(r.error){if(msg){msg.style.color='var(--late)';msg.textContent=r.error}return}
    toast('Bewaard');koppelOpen=false;await refreshServerInfo();render();
  }catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Bewaren mislukt'}}
}
async function bewaarKoppeling(g){
  const msg=$('#kmsg-'+g);const sec=KOPPEL_UI.find(x=>x.g===g);
  const data={};document.querySelectorAll('[data-kv]').forEach(i=>{if(sec.velden.some(v=>v.f===i.dataset.kv)&&!i.disabled)data[i.dataset.kv]=i.value});
  if(msg){msg.style.color='';msg.textContent='Bewaren…'}
  try{const r=await fetch('/api/koppelingen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data}),credentials:'same-origin'}).then(x=>x.json());
    if(r.error){if(msg){msg.style.color='var(--late)';msg.textContent=r.error}return}
    toast('Bewaard');koppelOpen=false;await refreshServerInfo();render();
  }catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Bewaren mislukt'}}
}
async function testKoppeling(g){
  const msg=$('#kmsg-'+g);if(msg){msg.style.color='';msg.textContent='Testen…'}
  try{const r=await fetch('/api/koppelingen/test',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groep:g}),credentials:'same-origin'}).then(x=>x.json());
    if(msg){msg.style.color=r.error?'var(--late)':'var(--ok)';msg.textContent=r.error||r.detail||'In orde'}}
  catch(e){if(msg){msg.style.color='var(--late)';msg.textContent='Test mislukt'}}
}
async function wisKoppeling(g){
  const msg=$('#kmsg-'+g);if(msg)msg.textContent='Wissen…';
  try{await fetch('/api/koppelingen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({wis:[g]}),credentials:'same-origin'});
    toast('Sleutels gewist');koppelOpen=false;await refreshServerInfo();render();}
  catch(e){if(msg)msg.textContent='Wissen mislukt'}
}
async function refreshServerInfo(){try{serverInfo=await (await fetch('/api/me',{credentials:'same-origin'})).json();setVersieBadge()}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-ksave],[data-ktest],[data-kwis],#factSave');if(!t)return;
  if(t.id==='factSave')return bewaarFacturatie();
  if(t.dataset.ksave)return bewaarKoppeling(t.dataset.ksave);
  if(t.dataset.ktest)return testKoppeling(t.dataset.ktest);
  if(t.dataset.kwis)return wisKoppeling(t.dataset.kwis);
});

/* ---------- boot ---------- */
render();
(async()=>{
  const me=await fetch('/api/me',{credentials:'same-origin'});
  if(me.status===401){location.replace('/?beheer=1');return}
  if(!me.ok){document.body.classList.add('ingelogd');dbFailed=true;render();return}
  serverInfo=await me.json();
  document.body.classList.add('ingelogd');
  setVersieBadge();
  db=apiDb();assets=apiAssets();sample=null;
  try{await db.load()}catch(e){if(e&&e.code!=='not_granted'){dbFailed=true;render()}return}
  db.collection('klanten').onSnapshot(snap=>{
    klanten=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded=true;
    if(view.v==='klant'&&mounted===view.id&&!klanten.some(k=>k.id===view.id)){mounted=null}
    render();
  });
  db.doc('instellingen/algemeen').onSnapshot(snap=>{
    if(cfgTimer||snap.metadata.hasPendingWrites)return;
    cfg=mergeCfg(snap.exists?snap.data():null);
    if(view.v!=='beheer'&&view.v!=='klant'&&loaded)render();
  });
})();
</script>

</body>
</html>
