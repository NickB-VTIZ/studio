<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wachtwoord instellen · justPIXIT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2F4EF;--card:#FBFBF8;--ink:#1C2A24;--ink-soft:#56655D;--green:#2C5A4C;--green-ink:#F7FAF6;--sage:#DDE7E0;--sage-deep:#C3D3C8;--line:#D2DBD3;--hair:#C8D2C9;--warn-bg:#F7E6DD;--warn-ink:#8A4B2E;--ok-bg:#E3EFE7;--ok-ink:#2C6A4C;--f-display:"Fraunces",Georgia,serif;--f-ui:"Figtree",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;padding-inline:18px;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
h1,p{margin:0}button,input{font:inherit;color:inherit}
.wrap{max-width:460px;margin:auto;width:100%;padding-block:48px}
.mark{text-align:center;margin-bottom:26px}.mark .logo{font-family:var(--f-display);font-size:22px}.mark .logo b{font-weight:500}.mark .tag{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-soft)}
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:4px;box-shadow:0 1px 0 var(--hair),0 18px 40px -28px rgba(28,42,36,.4);padding:6px}.sheet-in{border:1px solid var(--line);border-radius:3px;padding:clamp(24px,5vw,40px)}
.hero{text-align:center;margin:0 auto 4px}.hero .kicker{font-family:var(--f-display);font-style:italic;color:var(--green);font-size:16px}.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1.1;margin-top:6px}.hero p{margin:12px auto 0;color:var(--ink-soft)}
.rule{border:0;border-top:1px solid var(--line);max-width:70px;margin:24px auto}
.login{display:grid;gap:14px}.fld{display:grid;gap:6px}.fld>span{font-size:13.5px;color:var(--ink-soft)}
.fld input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:11px 13px}.fld input:focus{outline:none;border-color:var(--green);background:var(--card);box-shadow:0 0 0 3px var(--sage)}
.btn{border:1px solid var(--line);background:var(--card);padding:13px 22px;border-radius:3px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;color:var(--ink);display:inline-block;text-align:center}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}.btn.primary:hover{background:#244c40}.btn:disabled{opacity:.55;cursor:default}
.err{color:var(--warn-ink);background:var(--warn-bg);padding:11px 14px;border-radius:3px;font-size:14.5px}
.note{font-size:13.5px;color:var(--ink-soft);text-align:center}.center-msg{text-align:center;color:var(--ink-soft);padding:30px 0}
.foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:22px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><div class="logo">just<b>PIXIT</b></div><span class="tag">wachtwoord instellen</span></div>
  <div class="sheet"><div class="sheet-in" id="main"><p class="center-msg">Even geduld…</p></div></div>
  <p class="foot">justPIXIT · trouwuitnodigingen en geboortekaartjes</p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t')||'';
let info=null;
async function init(){
  if(!token){bad('Deze link is onvolledig. Gebruik de link uit je e-mail.');return}
  try{const r=await fetch('/api/invite?t='+encodeURIComponent(token),{credentials:'same-origin'});info=await r.json();if(!r.ok){bad(info.error||'Deze link is niet geldig.');return}}
  catch(e){bad('De pagina kon niet geladen worden. Probeer het later opnieuw.');return}
  render();
}
function bad(msg){$('#main').innerHTML=`<div class="hero"><h1>Oeps</h1></div><p class="err" style="margin-top:14px">${esc(msg)}</p><p class="note" style="margin-top:16px"><a href="/" style="color:var(--green)">Naar de inlogpagina</a></p>`}
function render(){
  $('#main').innerHTML=`<div class="hero"><span class="kicker">${info.nieuw?'welkom':'nieuw wachtwoord'}</span><h1>${info.nieuw?'Kies je wachtwoord':'Nieuw wachtwoord'}</h1><p>Voor ${esc(info.email)}</p></div><hr class="rule">
   <form id="pwform" class="login" novalidate>
    <label class="fld"><span>Nieuw wachtwoord <span class="note" style="display:inline">(min. 8 tekens)</span></span><input id="pw1" type="password" required autocomplete="new-password" autofocus></label>
    <label class="fld"><span>Herhaal wachtwoord</span><input id="pw2" type="password" required autocomplete="new-password"></label>
    <div id="perr"></div>
    <button class="btn primary" type="submit" id="psubmit">Wachtwoord instellen</button>
   </form>`;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='pwform')return;e.preventDefault();
  const pw1=$('#pw1').value,pw2=$('#pw2').value,er=$('#perr');er.innerHTML='';
  if(pw1.length<8){er.innerHTML='<p class="err">Kies minstens 8 tekens.</p>';return}
  if(pw1!==pw2){er.innerHTML='<p class="err">De twee wachtwoorden komen niet overeen.</p>';return}
  const btn=$('#psubmit');btn.disabled=true;btn.textContent='Bezig…';
  try{const r=await fetch('/api/invite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:token,wachtwoord:pw1}),credentials:'same-origin'});const j=await r.json().catch(()=>({}));
    if(r.ok){location.href=j.redirect||'/mijn';return}er.innerHTML=`<p class="err">${esc(j.error||'Instellen lukte niet')}</p>`}
  catch(err){er.innerHTML='<p class="err">Geen verbinding. Probeer opnieuw.</p>'}
  btn.disabled=false;btn.textContent='Wachtwoord instellen';
});
init();
</script>
</body>
</html>
