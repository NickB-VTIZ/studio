<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan een kennismaking · justPIXIT</title>
<meta name="description" content="Plan een vrijblijvend kennismakingsgesprek met justPIXIT voor jullie trouwuitnodigingen of geboortekaartje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap">
<style>
/* Uitnodiging-stijl: een gecentreerde "kaart" op warm papier, met inktgroen en fijne haarlijnen.
   Boven de sfeer en de drie feiten; daaronder de kalender en tijden naast elkaar; daarna het formulier. */
:root{
  --paper:#F5F2EF;--card:#FFFFFF;--ink:#2c2623;--ink-soft:#6b6460;
  --green:#7d5d44;--green-ink:#FFFFFF;
  --sage:#ede6df;--sage-deep:#ddd5cc;
  --line:#ddd6cf;--hair:#d5cec7;
  --warn-bg:#F7E6DD;--warn-ink:#8A4B2E;
  --ok-bg:#ede6df;--ok-ink:#5c4433;
  --f-display:"DM Sans",system-ui,sans-serif;
  --f-ui:"DM Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  padding-inline:18px;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--sage-deep)}
h1,h2,h3{margin:0;font-weight:500}
button,input,textarea,select{font:inherit;color:inherit}

.wrap{max-width:860px;margin:0 auto;padding-block:40px 72px}
@media (max-width:560px){.wrap{padding-block:26px 48px}}

/* wordmerk */
.mark{text-align:center;margin-bottom:30px}
.mark .logo{font-family:var(--f-ui);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#7d5d44;font-weight:600}
.mark .logo b{font-weight:600}
.mark .logo-img{display:block;margin:0 auto;max-height:70px;max-width:240px;width:auto}
.mark .tag{display:block;margin-top:8px;font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);letter-spacing:.08em;font-style:italic}

/* de uitnodigingskaart met dubbele haarlijn-rand */
.sheet{
  background:var(--card);border:1px solid var(--hair);border-radius:8px;
  box-shadow:0 1px 0 var(--hair), 0 18px 40px -28px rgba(125,93,68,.25);
  padding:6px;
}
.sheet-in{border:1px solid var(--line);border-radius:6px;padding:clamp(22px,4vw,44px)}

/* hero in de kaart */
.hero{text-align:center;max-width:34rem;margin:0 auto 10px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.hero p{margin:14px auto 0;color:var(--ink-soft);max-width:30rem}
.facts{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 4px}
.fact{display:flex;flex-direction:row;align-items:center;gap:10px}
.fact .k{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);min-width:84px;justify-content:flex-end}
.fact .k svg{width:16px;height:16px;stroke:var(--ink-soft);opacity:.85}
.fact .v{font-family:var(--f-display);font-weight:600;font-size:16px}
.rule{border:0;border-top:1px solid var(--line);max-width:70px;margin:26px auto}

/* stap-koppen (echte volgorde, dus genummerd, maar rustig gezet) */
.stephead{display:flex;align-items:baseline;gap:10px;margin:0 0 16px}
.stephead .no{font-family:var(--f-display);font-style:italic;font-size:18px;color:var(--green);font-weight:600}
.stephead h2{font-family:var(--f-display);font-weight:600;font-size:21px}

/* twee kolommen: kalender + tijden */
.booker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,16rem);gap:30px;align-items:start}
@media (max-width:620px){.booker{grid-template-columns:1fr;gap:26px}}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h3{font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:capitalize}
.nav{display:flex;gap:7px}
.nav button{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:17px;display:grid;place-items:center;line-height:1}
.nav button:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.nav button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.grid .wd{text-align:center;font-size:11px;color:var(--ink-soft);padding-bottom:7px;letter-spacing:.03em}
.day{position:relative;aspect-ratio:1;max-width:46px;width:100%;margin:0 auto;border:0;background:none;border-radius:50%;color:var(--sage-deep);cursor:default;font-variant-numeric:tabular-nums;font-size:15px;display:grid;place-items:center}
.day.free{background:var(--sage);color:var(--ink);cursor:pointer}
.day.free:hover{background:var(--sage-deep)}
.day.sel{background:var(--green);color:var(--green-ink);font-weight:500}
.day.today::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.legend{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
.legend i{width:13px;height:13px;border-radius:50%;background:var(--sage);display:inline-block}

/* tijden */
.slotwrap{min-width:0}
.slotwrap .lead{font-size:13px;color:var(--ink-soft);margin:0 0 12px}
.slotwrap .lead b{color:var(--ink);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4rem,1fr));gap:9px}
@media (max-width:620px){.slots{grid-template-columns:repeat(auto-fill,minmax(5rem,1fr))}}
.slot{border:1px solid var(--green);color:var(--green);background:var(--card);border-radius:3px;padding:12px 6px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px}
.slot:hover{background:var(--green);color:var(--green-ink)}
.vidopts{display:flex;gap:8px;flex-wrap:wrap}
.vidopt{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer;background:var(--card)}
.vidopt:hover{border-color:var(--sage-deep)}
.vidopt:has(input:checked){border-color:var(--green);background:var(--sage)}
.vidopt input[type=radio]{width:auto;min-width:0;border:0;padding:0;background:none;box-shadow:none;accent-color:var(--green);margin:0;flex:none}
.vidopt>svg{width:22px;height:22px;flex:none}
.vidopt>svg.brand{border-radius:5px}
.vidopt>span{flex:1;min-width:0}
.picks{display:grid;gap:8px}
.picks .vidopt{display:flex;width:100%}
.otherwrap{display:none}
.otherwrap.show{display:block}
.otherbox{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--card);font:inherit;color:inherit}
#gastlijst{display:grid;gap:8px}
#gastlijst:not(:empty){margin-bottom:8px}
.gastrow{display:flex;gap:8px;align-items:center}
.gastrow input{flex:1}
.gastrow .gast-del{flex:none;width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer}
.gastrow .gast-del:hover{border-color:var(--green);color:var(--green)}
.gastadd{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:4px 0;font-size:14.5px;justify-self:start;text-align:left}
.gastadd:hover{text-decoration:underline}
.slot-empty{color:var(--ink-soft);font-size:14px;border:1px dashed var(--line);border-radius:3px;padding:16px;text-align:center}
.pick-first{color:var(--ink-soft);font-size:14px;border:1px dashed var(--line);border-radius:3px;padding:20px 16px;text-align:center}

/* gekozen moment + formulier */
.chosen{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px 18px;margin-bottom:26px}
.chosen .lab{font-size:12px;color:var(--ink-soft)}
.chosen .when{font-family:var(--f-display);font-weight:600;font-size:18px;margin-top:2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.full{grid-column:1/-1}
.fld{display:grid;gap:6px;min-width:0}
.fld>span{font-size:13.5px;color:var(--ink-soft)}
.req{color:var(--green);font-weight:700;font-style:normal}
.verplicht-note{grid-column:1/-1;font-size:12.5px;color:var(--ink-soft);margin:-4px 0 2px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:11px 13px;min-width:0}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--green);background:var(--card);box-shadow:0 0 0 3px var(--sage)}
.fld textarea{resize:vertical;min-height:84px;font-family:inherit}

.btn{border:1px solid var(--line);background:var(--card);padding:13px 22px;border-radius:3px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.primary:hover{background:#65492f}
.btn.primary:disabled{opacity:.55;cursor:default}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);padding-inline:8px}
.btn.ghost:hover{color:var(--green)}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.submitrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:22px}
.submitrow .note{font-size:13.5px;color:var(--ink-soft)}
.err{color:var(--warn-ink);background:var(--warn-bg);padding:11px 14px;border-radius:3px;font-size:14.5px;margin-top:4px}

/* bevestiging */
.done{text-align:center;max-width:32rem;margin:0 auto}
.done .seal{width:58px;height:58px;border-radius:50%;background:var(--green);color:var(--green-ink);display:grid;place-items:center;margin:0 auto 20px;font-family:var(--f-display);font-size:30px}
.done h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1}
.done .intro{color:var(--ink-soft);margin:14px auto 22px}
.done .recap{text-align:left;display:inline-grid;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 22px;margin-bottom:22px}
.done .recap .row{display:grid;grid-template-columns:5.5rem 1fr;gap:14px;align-items:baseline}
.done .recap .k{font-size:12.5px;color:var(--ink-soft)}
.done .recap .v{font-size:15px}
.done .after{font-size:13.5px;color:var(--ink-soft);margin:0 0 20px}

.foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:28px}
.center-msg{text-align:center;color:var(--ink-soft);padding:40px 0}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.day,.slot,.btn,.nav button{transition:background .14s ease,color .14s ease,border-color .14s ease}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><div class="logo">just<b>PIXIT</b></div><span class="tag">gepersonaliseerd drukwerk voor jullie mooiste dag</span></div>
  <div class="sheet"><div class="sheet-in">
    <div id="hero"></div>
    <div id="main"><p class="center-msg">Beschikbare momenten ophalen…</p></div>
  </div></div>
  <p class="foot">justPIXIT · trouwuitnodigingen en geboortekaartjes</p>
</div>
<script>
/* Dynamische stijl uit Beheer */
fetch('/api/stijl').then(r=>r.json()).then(s=>{
  const r=document.documentElement.style;const k=s.kleuren||{};
  if(k.paper)r.setProperty('--paper',k.paper);if(k.card)r.setProperty('--card',k.card);
  if(k.ink)r.setProperty('--ink',k.ink);if(k['ink-soft'])r.setProperty('--ink-soft',k['ink-soft']);
  if(k.accent){r.setProperty('--green',k.accent);document.querySelectorAll('.mark .logo').forEach(el=>el.style.color=k.accent)}
  if(k['accent-ink'])r.setProperty('--green-ink',k['accent-ink']);
  if(k.sage)r.setProperty('--sage',k.sage);if(k.line){r.setProperty('--line',k.line);r.setProperty('--hair',k.line)}
  if(s.font){const f="'"+s.font+"',system-ui,sans-serif";r.setProperty('--f-display',f);r.setProperty('--f-ui',f);
    if(!document.querySelector('link[href*="'+s.font.replace(/ /g,'+')+'"]')){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(s.font)+':ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap';document.head.appendChild(l)}}
  if(s.logoId){const el=document.querySelector('.mark .logo');if(el){el.classList.add('is-img');el.innerHTML='<img class="logo-img" src="/_logo?v='+encodeURIComponent(s.logoId)+'" alt="'+(s.logo||'justPIXIT')+'">'}}
  else if(s.logo){const el=document.querySelector('.mark .logo');if(el){const parts=s.logo.match(/^(.*?)([A-Z][A-Z]+)$/);if(parts)el.innerHTML=parts[1]+'<b>'+parts[2]+'</b>';else el.textContent=s.logo}}
  // Op deze publieke afspraakpagina houden we onze eigen ondertitel (niet de portaal-tagline "jullie persoonlijke pagina").
}).catch(()=>{});
const IC={
  klok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  euro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7.5a6 6 0 1 0 0 9M5 10.5h8M5 13.5h8"/></svg>',
  teams:'<svg class="brand" viewBox="0 0 32 32" aria-hidden="true"><circle cx="23.2" cy="6.6" r="3.1" fill="#7B83EB"/><path d="M24.4 11.2H29a.9.9 0 0 1 .9.9v6.2a4.3 4.3 0 0 1-4.3 4.3 4 4 0 0 1-.9-.1V11.6a.4.4 0 0 1 .4-.4z" fill="#5059C9" opacity=".9"/><rect x="3" y="7.5" width="17.2" height="17" rx="3" fill="#7B83EB"/><path d="M7.4 11.6h8.4v2.3h-3v7.9h-2.5v-7.9H7.4z" fill="#fff"/></svg>',
  zoom:'<svg class="brand" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#2D8CFF"/><path d="M6.5 12.4c0-1 .8-1.9 1.9-1.9h7.4c1 0 1.9.8 1.9 1.9v7.2c0 1-.8 1.9-1.9 1.9H8.4c-1 0-1.9-.8-1.9-1.9v-7.2zM19.7 14.1l4.1-2.4c.6-.3 1.2.1 1.2.7v7.2c0 .6-.6 1-1.2.7l-4.1-2.4v-3.8z" fill="#fff"/></svg>'
};
const isAnder=v=>/^(ander|andere|other|iets anders)$/i.test(String(v==null?'':v).trim());
const locIcon=id=>id==='teams'?IC.teams:(id==='zoom'?IC.zoom:IC.pin);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const parseDay=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const isoDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtLong=s=>parseDay(s).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
const fmtLongY=s=>parseDay(s).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const pick=(name,opts,o={})=>`<div class="picks">${opts.map((op,i)=>{const val=op&&op.value!==undefined?op.value:op;const lab=op&&op.label!==undefined?op.label:op;const ic=(op&&op.icon)||'';const ander=o.other&&isAnder(val);return `<label class="vidopt"><input type="radio" name="${name}" value="${esc(val)}"${o.checkFirst&&i===0?' checked':''}${ander?' data-ander="1"':''}>${ic}<span>${esc(lab)}</span></label>${ander?`<div class="otherwrap"><input type="text" class="otherbox" id="${name}-other" placeholder="Vul hier aan…" maxlength="120" aria-label="Andere, vul aan"></div>`:''}`;}).join('')}</div>`;
let cfg=null,byDay={},month=null,selDay=null,selSlot=null,busy=false;
const EVENT_ID=(()=>{const m=location.pathname.match(/^\/afspraak\/([a-z0-9][a-z0-9-]*)\/?$/);if(m&&m[1]!=='wijzig')return m[1];return new URLSearchParams(location.search).get('e')||'';})();
const evQ=p=>p+(EVENT_ID?(p.includes('?')?'&':'?')+'e='+encodeURIComponent(EVENT_ID):'');

async function init(){
  let r;try{r=await (await fetch(evQ('/api/boeking/slots'))).json()}catch(e){$('#main').innerHTML='<p class="err">De agenda kon niet geladen worden. Probeer het later opnieuw.</p>';return}
  cfg=r;renderHero();
  if(!r.actief){$('#main').innerHTML='<p class="center-msg">Online boeken staat even uit. Stuur gerust een berichtje via Instagram of mail, dan plannen we samen een moment.</p>';return}
  byDay={};r.dagen.forEach(d=>byDay[d.datum]=d.slots);
  const first=r.dagen[0]?r.dagen[0].datum:isoDay(new Date());
  month=first.slice(0,7);selDay=null;selSlot=null;
  renderMain();
}
function renderHero(){
  $('#hero').innerHTML=`<div class="hero"><h1>${esc(cfg.titel||'Kennismaking')}</h1>
    ${cfg.intro?`<p>${esc(cfg.intro)}</p>`:''}
    <div class="facts">
      <div class="fact"><span class="k">${IC.klok}Duur</span><span class="v">${cfg.duur} min</span></div>
      <div class="fact"><span class="k">${IC.pin}Waar</span><span class="v">${esc((cfg.locatie||'').split(',')[0]||'In overleg')}</span></div>
      <div class="fact"><span class="k">${IC.euro}Kost</span><span class="v">Gratis</span></div>
    </div></div><hr class="rule">`;
}
function renderMain(){
  if(selSlot){$('#main').innerHTML=renderForm();return}
  $('#main').innerHTML=`<div class="booker">
    <div><div class="stephead"><span class="no">1</span><h2>Kies een dag</h2></div>${renderCalendar()}</div>
    <div class="slotwrap" id="slotbox"><div class="stephead"><span class="no">2</span><h2>Kies een uur</h2></div>${selDay?renderSlots():'<p class="pick-first">Kies eerst een dag met een zachte stip.</p>'}</div>
  </div>`;
}
function renderCalendar(){
  const [y,mo]=month.split('-').map(Number);const first=new Date(y,mo-1,1);const start=(first.getDay()+6)%7;const days=new Date(y,mo,0).getDate();
  const today=isoDay(new Date());const months=Object.keys(byDay).map(d=>d.slice(0,7));const minM=months[0]||month,maxM=months[months.length-1]||month;
  let cells='';for(let i=0;i<start;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){const ds=`${y}-${pad(mo)}-${pad(d)}`;const free=!!byDay[ds];
    cells+=`<button class="day ${free?'free':''} ${ds===selDay?'sel':''} ${ds===today?'today':''}" ${free?`data-day="${ds}"`:'disabled'} aria-label="${esc(fmtLongY(ds))}${free?', '+byDay[ds].length+' momenten vrij':', geen momenten'}">${d}</button>`}
  return `<div class="cal-head"><h3>${first.toLocaleDateString('nl-BE',{month:'long',year:'numeric'})}</h3><div class="nav"><button data-nav="-1" ${month<=minM?'disabled':''} aria-label="Vorige maand">‹</button><button data-nav="1" ${month>=maxM?'disabled':''} aria-label="Volgende maand">›</button></div></div>
   <div class="grid">${['ma','di','wo','do','vr','za','zo'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div>
   <div class="legend"><i></i>dagen met een zachte stip zijn vrij</div>`;
}
function renderSlots(){
  const slots=byDay[selDay]||[];
  return `<p class="lead">Vrije momenten op <b>${esc(fmtLong(selDay))}</b></p>
   ${slots.length?`<div class="slots">${slots.map(s=>`<button class="slot" data-slot="${s}">${s.slice(11,16)}</button>`).join('')}</div>`:'<p class="slot-empty">Geen vrije momenten meer op deze dag.</p>'}`;
}
function renderForm(){
  const types=(cfg.types||[]).filter(Boolean);const vragen=(cfg.vragen||[]).filter(v=>v&&!/gevonden|leren kennen|ken je|ken jij|hoe ken/i.test(v));
  const bronOpties=['Via Google','(Huwelijks)beurs','Social media','Mond-aan-mond reclame','Andere'];
  return `<form id="bform" novalidate>
   <div class="chosen"><div><div class="lab">Jullie moment</div><div class="when">${esc(fmtLong(selSlot.slice(0,10)))} om ${selSlot.slice(11,16)}</div></div><button type="button" class="btn ghost" id="back">Ander moment kiezen</button></div>
   <div class="stephead"><span class="no">3</span><h2>Jullie gegevens</h2></div>
   <div class="form">
    <p class="verplicht-note">Velden met <b class="req">*</b> zijn verplicht.</p>
    <label class="fld full"><span>Naam of namen <b class="req">*</b></span><input id="f-naam" required maxlength="120" placeholder="bv. Lotte &amp; Bram"></label>
    <label class="fld"><span>E-mail <b class="req">*</b></span><input id="f-email" type="email" required maxlength="160" placeholder="naam@voorbeeld.be"></label>
    <label class="fld"><span>Telefoon <b class="req">*</b></span><input id="f-tel" type="tel" required maxlength="40" placeholder="bv. 0470 12 34 56"></label>
    <div class="fld full" id="gastveld"><span>Gasten <span class="hint" style="font-weight:400">(optioneel)</span></span>
     <div id="gastlijst"></div>
     <button type="button" class="gastadd" id="gastAdd">+ Gast toevoegen</button>
     <p class="hint" style="margin:6px 0 0">Extra mensen die ook een uitnodiging in hun agenda krijgen.</p></div>
    ${types.length?`<div class="fld full"><span>Waarvoor?</span>${pick('f-type',types.map(t=>({value:t,label:t})),{other:true})}</div>`:''}
    ${(()=>{const opts=[];if(cfg.kantoor)opts.push({value:'kantoor',label:cfg.kantoorNaam||'Op kantoor',icon:IC.pin});(cfg.video||[]).forEach(v=>opts.push({value:v.id,label:v.label,icon:locIcon(v.id)}));if(!opts.length)return '';return `<div class="fld full"><span>Locatie <b class="req">*</b></span>${pick('f-locatie',opts,{checkFirst:true})}</div>`;})()}
    <label class="fld"><span>Datum (huwelijk, geboorte…) als die al vastligt</span><input id="f-event" type="date"></label>
    <div class="fld full"><span>Waar ken je justPIXIT? <b class="req">*</b></span>${pick('f-bron',bronOpties.map(b=>({value:b,label:b})),{other:true})}</div>
    ${vragen.map((v,i)=>`<label class="fld full"><span>${esc(v)}</span><input data-vraag="${esc(v)}" id="f-v${i}" maxlength="500"></label>`).join('')}
    <label class="fld full"><span>Vertel al iets over jullie plannen (optioneel)</span><textarea id="f-bericht" maxlength="2000" placeholder="Stijl, aantal gasten, inspiratie…"></textarea></label>
   </div>
   <div id="ferr"></div>
   <div class="submitrow"><button class="btn primary" type="submit" id="submit">Bevestig onze afspraak</button><span class="note">Je krijgt meteen een bevestiging.</span></div>
  </form>`;
}
function icsLink(slot){
  const start=parseDay(slot);const [h,mi]=slot.slice(11,16).split(':').map(Number);start.setHours(h,mi,0,0);const end=new Date(start.getTime()+cfg.duur*60000);
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//justPIXIT//Studio//NL','BEGIN:VEVENT',`UID:${Date.now()}@justpixit`,`DTSTAMP:${f(new Date())}`,`DTSTART;TZID=Europe/Brussels:${f(start)}`,`DTEND;TZID=Europe/Brussels:${f(end)}`,`SUMMARY:${cfg.titel} - justPIXIT`,`LOCATION:${(cfg.locatie||'').replace(/,/g,'\\,')}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}
const eindUur=(slot,duur)=>{const [h,m]=slot.slice(11,16).split(':').map(Number);const t=h*60+m+duur;return pad(Math.floor(t/60)%24)+':'+pad(t%60)};
function renderDone(r){
  $('#hero').innerHTML='';
  $('#main').innerHTML=`<div class="done"><div class="seal" aria-hidden="true">✓</div>
   <h2>Tot ${esc(fmtLong(r.slot.slice(0,10)))}!</h2>
   <p class="intro">${esc(r.bevestiging)}</p>
   <div class="recap">
     <div class="row"><span class="k">Wanneer</span><span class="v">${esc(fmtLongY(r.slot.slice(0,10)))}<br>${r.slot.slice(11,16)} – ${eindUur(r.slot,r.duur)} (${r.duur} min)</span></div>
     ${r.videolink?`<div class="row"><span class="k">Videocall</span><span class="v"><a href="${esc(r.videolink)}" target="_blank" rel="noopener">${esc(r.videoprovider||'Deelnemen')}</a></span></div>`:`<div class="row"><span class="k">Waar</span><span class="v">${esc(r.locatie)}</span></div>`}
   </div>
   <p class="after">${r.mail?'Er is een bevestiging naar je mailbox onderweg.':'Noteer dit moment gerust in je agenda.'}</p>
   <a class="btn primary" href="${icsLink(r.slot)}" download="afspraak-justpixit.ics">Zet in mijn agenda</a></div>`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-day],[data-nav],[data-slot],#back');if(!t)return;
  if(t.dataset.day){selDay=t.dataset.day;renderMain();if(window.innerWidth<=620){const sb=$('#slotbox');if(sb)sb.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(t.dataset.nav){const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+Number(t.dataset.nav),1);month=d.getFullYear()+'-'+pad(d.getMonth()+1);renderMain();return}
  if(t.dataset.slot){selSlot=t.dataset.slot;renderMain();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.id==='back'){selSlot=null;renderMain();return}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='bform')return;e.preventDefault();if(busy)return;
  const naam=$('#f-naam').value.trim(),email=$('#f-email').value.trim(),telefoon=$('#f-tel').value.trim();const err=$('#ferr');err.innerHTML='';
  const pickVal=(name)=>{const el=document.querySelector(`input[name="${name}"]:checked`);if(!el)return'';let v=el.value;if(el.dataset.ander){const tx=document.getElementById(name+'-other');if(tx&&tx.value.trim())v=tx.value.trim()}return v};
  const heeftType=!!document.querySelector('input[name="f-type"]');
  const bronGekozen=!!document.querySelector('input[name="f-bron"]:checked');
  if(naam.length<2){err.innerHTML='<p class="err">Vul jullie naam in.</p>';$('#f-naam').focus();return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.innerHTML='<p class="err">Vul een geldig e-mailadres in.</p>';$('#f-email').focus();return}
  if(telefoon.replace(/[^0-9]/g,'').length<6){err.innerHTML='<p class="err">Vul een telefoonnummer in.</p>';$('#f-tel').focus();return}
  if(!bronGekozen){err.innerHTML='<p class="err">Laat even weten waar je justPIXIT kent.</p>';const fb=document.querySelector('input[name="f-bron"]');if(fb)fb.focus();return}
  const antwoorden={};document.querySelectorAll('[data-vraag]').forEach(i=>{if(i.value.trim())antwoorden[i.dataset.vraag]=i.value.trim()});
  const bron=pickVal('f-bron');if(bron)antwoorden['Waar ken je justPIXIT?']=bron;
  const locatie=(document.querySelector('input[name="f-locatie"]:checked')||{}).value||'';
  const gasten=[...document.querySelectorAll('.gast-email')].map(i=>i.value.trim()).filter(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
  const body={naam,email,telefoon,type:pickVal('f-type'),locatie,datumEvent:$('#f-event').value,bericht:$('#f-bericht').value.trim(),slot:selSlot,antwoorden,gasten};
  busy=true;$('#submit').disabled=true;$('#submit').textContent='Even geduld…';
  try{const r=await fetch(evQ('/api/boeking'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
    if(!r.ok){err.innerHTML=`<p class="err">${esc(j.error||'Er liep iets mis.')}</p>`;if(r.status===409){selSlot=null;await init()}return}
    renderDone(j);window.scrollTo({top:0,behavior:'smooth'});
  }catch(e2){err.innerHTML='<p class="err">Geen verbinding. Probeer het opnieuw.</p>'}
  finally{busy=false;const b=$('#submit');if(b){b.disabled=false;b.textContent='Bevestig onze afspraak'}}
});
document.addEventListener('change',e=>{const el=e.target;if(el.type==='radio'&&el.closest&&el.closest('.picks')){const p=el.closest('.picks');const a=p.querySelector('input[data-ander]');const w=p.querySelector('.otherwrap');if(w){const show=!!(a&&a.checked);w.classList.toggle('show',show);if(show){const inp=w.querySelector('.otherbox');if(inp)setTimeout(()=>inp.focus(),0)}}}});
function gastRij(){const d=document.createElement('div');d.className='gastrow';d.innerHTML='<input type="email" class="gast-email" placeholder="gast@email.be" maxlength="160"><button type="button" class="gast-del" aria-label="Verwijderen">×</button>';return d}
document.addEventListener('click',e=>{
  if(e.target.id==='gastAdd'){const l=document.getElementById('gastlijst');if(l){const r=gastRij();l.appendChild(r);const i=r.querySelector('input');if(i)i.focus()}return}
  if(e.target.classList&&e.target.classList.contains('gast-del')){const row=e.target.closest('.gastrow');if(row)row.remove();return}
});
init();
</script>
</body>
</html>
