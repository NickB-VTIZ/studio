<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jullie dossier · justPIXIT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap">
<style>
/* Dossier met persoonlijke code (geen login): afspraak, offerte, vragenlijst, contract. Warme justPIXIT-huisstijl. */
:root{--paper:#F5F2EF;--card:#FFFFFF;--ink:#2c2623;--ink-soft:#6b6460;--green:#7d5d44;--green-ink:#FFFFFF;--sage:#ede6df;--sage-deep:#ddd5cc;--line:#ddd6cf;--hair:#d5cec7;--warn-bg:#F7E6DD;--warn-ink:#8A4B2E;--ok-bg:#ede6df;--ok-ink:#5c4433;--f-display:"DM Sans",system-ui,sans-serif;--f-ui:"DM Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;padding-inline:18px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:40px 72px}@media (max-width:560px){.wrap{padding-block:26px 48px}}
.mark{text-align:center;margin-bottom:30px}.mark .logo{font-family:var(--f-ui);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:#7d5d44;font-weight:600}.mark .tag{display:block;margin-top:5px;font-family:var(--f-ui);font-size:14px;color:var(--ink-soft);letter-spacing:.08em;font-style:italic}
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:8px;box-shadow:0 1px 0 var(--hair),0 18px 40px -28px rgba(125,93,68,.25);padding:6px}.sheet-in{border:1px solid var(--line);border-radius:6px;padding:clamp(22px,4vw,44px)}
.hero{text-align:center;max-width:34rem;margin:0 auto 6px}.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15}.hero p{margin:12px auto 0;color:var(--ink-soft)}
.rule{border:0;border-top:1px solid var(--line);max-width:70px;margin:26px auto}
section.blok{margin-top:34px}section.blok:first-of-type{margin-top:0}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}.bhead h2{font-family:var(--f-display);font-weight:600;font-size:21px}.bhead .meta{font-size:13px;color:var(--ink-soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 20px}
.recap{display:grid;gap:10px}.recap .row{display:grid;grid-template-columns:6rem 1fr;gap:14px;align-items:baseline}@media (max-width:420px){.recap .row{grid-template-columns:1fr;gap:2px}}
.recap .k{font-size:12.5px;color:var(--ink-soft)}.recap .v{font-size:15.5px}.recap .v.big{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:12px 20px;border-radius:3px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}.btn.primary:hover{background:#65492f}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);padding-inline:8px}.btn.ghost:hover{color:var(--green)}.btn.small{padding:8px 14px;font-size:14px}.btn.danger{color:var(--warn-ink)}
.err{color:var(--warn-ink);background:var(--warn-bg);padding:11px 14px;border-radius:3px;font-size:14.5px;margin-top:10px}.ok{color:var(--ok-ink);background:var(--ok-bg);padding:11px 14px;border-radius:3px;font-size:14.5px;margin-top:10px}
.note{font-size:13.5px;color:var(--ink-soft)}.center-msg{text-align:center;color:var(--ink-soft);padding:40px 0}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sage);color:var(--ink)}.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.dtabs{display:flex;gap:2px;margin:0 0 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dtabs button{border:0;background:none;padding:10px 18px;cursor:pointer;font:inherit;font-weight:500;font-size:15px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button:hover{color:var(--ink)}.dtabs button.on{color:var(--green);border-bottom-color:var(--green)}
.fac-cli-sum{display:flex;gap:30px;flex-wrap:wrap}
.fac-cli-sum>div{display:grid;gap:3px}
.fac-cli-sum span{font-size:12.5px;color:var(--ink-soft)}
.fac-cli-sum b{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.fac-cli-sum b.pos{color:var(--ok-ink)}.fac-cli-sum b.neg{color:var(--warn-ink)}
.fac-cli-h{font-family:var(--f-display);font-weight:600;font-size:16px;margin:18px 0 12px}
.paycard{margin-bottom:18px}
.payhead{font-size:17px;margin:0}.payhead b{font-weight:600}
.paybar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--sage);margin:14px 0 12px}
.paybar .seg{height:100%}
.seg.betaald{background:var(--green)}.seg.open{background:#C58A3D}
.seg.verwacht{background:repeating-linear-gradient(45deg,var(--sage-deep),var(--sage-deep) 6px,var(--sage) 6px,var(--sage) 12px)}
.paylegend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft)}
.paylegend span{display:inline-flex;align-items:center;gap:7px}
.paylegend .dot{width:11px;height:11px;border-radius:3px;flex:none}
.dot.betaald{background:var(--green)}.dot.open{background:#C58A3D}.dot.verwacht{background:var(--sage-deep)}
.verwacht-card{border-style:dashed}
.steps{list-style:none;margin:0;padding:0;display:grid}.steps li{position:relative;padding:0 0 18px 30px}.steps li::before{content:"";position:absolute;left:8px;top:22px;bottom:-2px;width:2px;background:var(--line)}.steps li:last-child::before{display:none}
.steps .mk{position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--card)}.steps li.done .mk{background:var(--green);border-color:var(--green)}
.steps li.done .mk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--green-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}.steps li.done::before{background:var(--green)}
.steps li.cur .mk{border-color:var(--green);box-shadow:0 0 0 4px var(--sage)}.steps .t{font-weight:500}.steps li.todo .t{color:var(--ink-soft);font-weight:400}.steps .d{font-size:12.5px;color:var(--ink-soft);margin-left:8px}
.steps .u{display:block;font-size:14px;color:var(--ink-soft);margin-top:3px;max-width:48ch}.steps li.cur .u{color:var(--ink)}
.steps li.cur{background:var(--sage);border-radius:3px;margin-left:-10px;padding-left:40px;padding-top:10px;padding-bottom:12px;margin-bottom:8px}.steps li.cur .mk{left:10px;top:14px}.steps li.cur::before{left:18px;top:32px}
.booker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,16rem);gap:30px;align-items:start;margin-top:16px}@media (max-width:620px){.booker{grid-template-columns:1fr;gap:26px}}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.cal-head h3{font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:capitalize}
.nav{display:flex;gap:7px}.nav button{border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px;display:grid;place-items:center;line-height:1}.nav button:hover:not(:disabled){border-color:var(--green);color:var(--green)}.nav button:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.grid .wd{text-align:center;font-size:11px;color:var(--ink-soft);padding-bottom:7px}
.day{position:relative;aspect-ratio:1;max-width:46px;width:100%;margin:0 auto;border:0;background:none;border-radius:50%;color:var(--sage-deep);cursor:default;font-variant-numeric:tabular-nums;font-size:15px;display:grid;place-items:center}
.day.free{background:var(--sage);color:var(--ink);cursor:pointer}.day.free:hover{background:var(--sage-deep)}.day.sel{background:var(--green);color:var(--green-ink);font-weight:500}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4rem,1fr));gap:9px}.slot{border:1px solid var(--green);color:var(--green);background:var(--card);border-radius:3px;padding:12px 6px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px}.slot:hover,.slot.sel{background:var(--green);color:var(--green-ink)}
.lead{font-size:13px;color:var(--ink-soft);margin:0 0 12px}.lead b{color:var(--ink);font-weight:600}.pick-first,.slot-empty{color:var(--ink-soft);font-size:14px;border:1px dashed var(--line);border-radius:3px;padding:18px 16px;text-align:center}
.chosen{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--green);border-radius:3px;padding:14px 18px;margin-top:18px}.chosen .lab{font-size:12px;color:var(--ink-soft)}.chosen .when{font-family:var(--f-display);font-weight:600;font-size:18px;margin-top:2px}
.fld{display:grid;gap:6px;min-width:0}.fld>span{font-size:13.5px;color:var(--ink-soft)}.fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:3px;padding:11px 13px;min-width:0}.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--sage)}.fld textarea{resize:vertical;min-height:70px}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sig{border:1px dashed var(--sage-deep);background:#fff;border-radius:3px;width:100%;max-width:520px;height:160px;touch-action:none;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}.chk input{margin-top:4px;accent-color:var(--green)}
.foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:28px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* vragenlijst enhanced */
.vl-intro{background:var(--sage);border:1px solid var(--sage-deep);border-radius:3px;padding:16px 20px;margin-bottom:18px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.vl-intro summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:16px;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
.vl-intro summary::-webkit-details-marker{display:none}
.vl-intro summary::before{content:"▸";font-size:13px;transition:transform .15s;display:inline-block;width:14px}
.vl-intro[open] summary::before{transform:rotate(90deg)}
.vl-intro .body{margin-top:12px;display:grid;gap:8px}
.vl-intro .body p{margin:0}
.vl-intro .body ul{margin:4px 0;padding-left:20px}
.vl-intro .body li{margin:2px 0}
.vl-progress{display:flex;align-items:center;gap:12px;margin-bottom:4px;font-size:13px;color:var(--ink-soft)}
.vl-progress .bar{flex:1;height:6px;background:var(--sage);border-radius:3px;overflow:hidden}.vl-progress .bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.vl-saved{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ok-ink);opacity:0;transition:opacity .3s}
.vl-saved.show{opacity:1}
.vl-saved svg{width:14px;height:14px}
.vl-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.vl-sec{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--green);margin:8px 0 -4px;padding-bottom:6px;border-bottom:1px solid var(--sage-deep)}
.vl-desc{font-size:13px;color:var(--ink-soft);margin-top:-2px}
.vl-choices{display:grid;gap:6px;margin-top:4px}
.vl-choices label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--card)}
.vl-choices label:hover{border-color:var(--green)}
.vl-choices input[type="radio"],.vl-choices input[type="checkbox"]{accent-color:var(--green);margin:0;flex-shrink:0}
.vl-upload{display:grid;gap:8px}
.vl-upload-drop{border:2px dashed var(--sage-deep);border-radius:3px;padding:20px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:14px;transition:border-color .15s,background .15s}
.vl-upload-drop:hover,.vl-upload-drop.drag{border-color:var(--green);background:var(--sage)}
.vl-upload-drop input[type="file"]{display:none}
.vl-files{display:grid;gap:6px}
.vl-file{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sage);border-radius:3px;font-size:13.5px}
.vl-file .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vl-file .rm{border:0;background:none;cursor:pointer;color:var(--ink-soft);font-size:16px;padding:0 4px}
.vl-file .rm:hover{color:var(--warn-ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><div class="logo">justPIXIT.be</div></div>
  <div class="sheet"><div class="sheet-in" id="main"><p class="center-msg">Even geduld…</p></div></div>
  <p class="foot">justPIXIT · trouwuitnodigingen en geboortekaartjes</p>
</div>
<script>
/* Dynamische stijl uit Beheer */
fetch('/api/stijl').then(r=>r.json()).then(s=>{
  const r=document.documentElement.style;const k=s.kleuren||{};
  if(k.paper)r.setProperty('--paper',k.paper);if(k.card)r.setProperty('--card',k.card);
  if(k.ink)r.setProperty('--ink',k.ink);if(k['ink-soft'])r.setProperty('--ink-soft',k['ink-soft']);
  if(k.accent){r.setProperty('--green',k.accent);document.querySelectorAll('.mark .logo').forEach(el=>el.style.color=k.accent)}
  if(k['accent-ink'])r.setProperty('--green-ink',k['accent-ink']);
  if(k.sage)r.setProperty('--sage',k.sage);if(k.line){r.setProperty('--line',k.line);r.setProperty('--hair',k.line)}
  if(s.font){const f="'"+s.font+"',system-ui,sans-serif";r.setProperty('--f-display',f);r.setProperty('--f-ui',f);
    if(!document.querySelector('link[href*="'+s.font.replace(/ /g,'+')+'"]')){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(s.font)+':ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap';document.head.appendChild(l)}}
  if(s.logo){const el=document.querySelector('.mark .logo');if(el){const parts=s.logo.match(/^(.*?)([A-Z][A-Z]+)$/);if(parts)el.innerHTML=parts[1]+'<b>'+parts[2]+'</b>';else el.textContent=s.logo}}
  if(s.tagline!=null){const el=document.querySelector('.mark .tag');if(el)el.textContent=s.tagline}
}).catch(()=>{});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const parseDay=s=>{const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const isoDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtLong=s=>parseDay(s).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
const fmtLongY=s=>parseDay(s).toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtShort=s=>s?parseDay(s).toLocaleDateString('nl-BE',{day:'numeric',month:'short',year:'numeric'}):'';
const eindUur=(slot,duur)=>{const [h,m]=slot.slice(11,16).split(':').map(Number);const t=h*60+m+duur;return pad(Math.floor(t/60)%24)+':'+pad(t%60)};
const euro=n=>(Number(n)||0).toLocaleString('nl-BE',{style:'currency',currency:'EUR'});
const code=new URLSearchParams(location.search).get('c')||'';
let me=null,kiezen=false,annuleren=false,byDay={},month=null,selDay=null,selSlot=null,busy=false,msg={},ofOpen={},tab='overzicht';
const numEur=v=>{const n=parseFloat(String(v??'').replace(/\s|€/g,'').replace(',','.'));return Number.isFinite(n)?n:0};

async function api(path,body){const r=await fetch('/api/dossier/'+encodeURIComponent(code)+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw Object.assign(new Error(j.error||'Er liep iets mis'),{status:r.status});return j}
async function init(){
  if(!code){$('#main').innerHTML='<p class="err">Deze link is onvolledig. Gebruik de link uit je e-mail.</p>';return}
  try{me=await api('')}catch(e){$('#main').innerHTML=`<p class="err">${esc(e.message)}</p>`;return}
  render();
}
async function herlaad(){try{me=await api('')}catch(e){}render()}
function render(){
  const openOf=(me.offertes||[]).some(o=>o.status==='Verstuurd');
  const toonVragen=me.vragenlijst&&me.vragenlijst.nodig&&me.vragenlijst.vragen.length;
  const toonContract=me.contract&&me.contract.bestandId;
  const overzicht=`${openOf?renderOffertes():''}${toonVragen?renderVragenlijst():''}${toonContract?renderContract():''}${!openOf&&(me.offertes||[]).length?renderOffertes():''}${(me.bijlages||[]).length?renderBijlages():''}`;
  const sub=me.gestopt?(me.fase==='geannuleerd'?'Dit traject werd geannuleerd. Jullie zijn altijd welkom voor een nieuw project.':'Dit traject werd afgesloten. Jullie zijn altijd welkom voor een nieuw project.'):(tab==='facturen'?'Hier volg je de betalingen op: wat al betaald is en wat er nog moet aankomen.':'Ik begin binnenkort aan jullie ontwerpje! Maar hiervoor heb ik nog enkele gegevens nodig.<br>Kunnen jullie voor mij de onderstaande lijst invullen?');
  const tabsBar=`<div class="dtabs" role="tablist"><button role="tab" class="${tab==='overzicht'?'on':''}" data-dtab="overzicht">Overzicht</button><button role="tab" class="${tab==='facturen'?'on':''}" data-dtab="facturen">Facturatie</button></div>`;
  $('#main').innerHTML=`<div class="hero"><h1>Hoi ${esc(me.voornaam||'daar')}</h1><p>${sub}</p></div><hr class="rule">
   ${tabsBar}
   ${tab==='facturen'?renderFacturatie():overzicht}`;
  if(tab==='overzicht'&&toonContract&&!me.contract.getekend)setTimeout(initSig,0);
}
function renderFacturatie(){
  const facs=me.facturen||[];
  const projectTotaal=Number(me.projectTotaal)||0;
  const gefactureerd=facs.reduce((a,f)=>a+numEur(f.bedrag),0);
  const betaald=facs.filter(f=>f.betaald).reduce((a,f)=>a+numEur(f.bedrag),0);
  const openstaand=Math.max(0,gefactureerd-betaald);
  const nogTeVerwachten=Math.max(0,projectTotaal-gefactureerd);
  if(!facs.length&&!projectTotaal)return `<section class="blok"><div class="bhead"><h2>Facturatie</h2></div><div class="card"><p class="note" style="margin:0">Er staan nog geen facturen klaar. Zodra er een factuur is, verschijnt ze hier met de betaalstatus en kan je ze downloaden.</p></div></section>`;
  const today=isoDay(new Date());
  const basis=Math.max(projectTotaal,gefactureerd,betaald)||1;
  const pct=n=>Math.max(0,Math.min(100,n/basis*100));
  const volledigBetaald=betaald>0&&openstaand===0&&nogTeVerwachten===0;
  const head=projectTotaal>0?`Je betaalde <b>${euro(betaald)}</b> van <b>${euro(projectTotaal)}</b>`:`Betaald: <b>${euro(betaald)}</b> van ${euro(gefactureerd)}`;
  const bar=`<div class="paybar">${betaald>0?`<i class="seg betaald" style="width:${pct(betaald)}%"></i>`:''}${openstaand>0?`<i class="seg open" style="width:${pct(openstaand)}%"></i>`:''}${nogTeVerwachten>0?`<i class="seg verwacht" style="width:${pct(nogTeVerwachten)}%"></i>`:''}</div>`;
  const legend=`<div class="paylegend"><span><i class="dot betaald"></i>Betaald ${euro(betaald)}</span>${openstaand>0?`<span><i class="dot open"></i>Nog te betalen ${euro(openstaand)}</span>`:''}${nogTeVerwachten>0?`<span><i class="dot verwacht"></i>Nog te verwachten ± ${euro(nogTeVerwachten)}</span>`:''}</div>`;
  const progress=`<div class="card paycard"><p class="payhead">${volledigBetaald?'Alles is betaald — bedankt!':head}</p>${bar}${legend}</div>`;
  const kaart=f=>{
    const bedrag=numEur(f.bedrag);
    const vervallen=!f.betaald&&f.vervaldatum&&f.vervaldatum<today;
    const pill=f.betaald?`<span class="pill ok">Betaald${f.betaaldOp?' op '+esc(fmtShort(f.betaaldOp)):''}</span>`:(vervallen?'<span class="pill warn">Vervallen</span>':'<span class="pill">Te betalen</span>');

function renderCalendar(){
  const [y,mo]=month.split('-').map(Number);const first=new Date(y,mo-1,1);const start=(first.getDay()+6)%7;const days=new Date(y,mo,0).getDate();
  const months=Object.keys(byDay).map(d=>d.slice(0,7));const minM=months[0]||month,maxM=months[months.length-1]||month;
  let cells='';for(let i=0;i<start;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){const ds=`${y}-${pad(mo)}-${pad(d)}`;const free=!!byDay[ds];cells+=`<button class="day ${free?'free':''} ${ds===selDay?'sel':''}" ${free?`data-day="${ds}"`:'disabled'} aria-label="${esc(fmtLongY(ds))}">${d}</button>`}
  return `<div class="cal-head"><h3>${first.toLocaleDateString('nl-BE',{month:'long',year:'numeric'})}</h3><div class="nav"><button data-nav="-1" ${month<=minM?'disabled':''} aria-label="Vorige maand">‹</button><button data-nav="1" ${month>=maxM?'disabled':''} aria-label="Volgende maand">›</button></div></div>
   <div class="grid">${['ma','di','wo','do','vr','za','zo'].map(w=>`<span class="wd">${w}</span>`).join('')}${cells}</div>`;
}
function renderSlots(){const slots=byDay[selDay]||[];return slots.length?`<div class="slots">${slots.map(s=>`<button class="slot ${s===selSlot?'sel':''}" data-slot="${s}">${s.slice(11,16)}</button>`).join('')}</div>`:'<p class="slot-empty">Geen vrije momenten meer op deze dag.</p>'}
function icsLink(slot){
  const start=parseDay(slot);const [h,mi]=slot.slice(11,16).split(':').map(Number);start.setHours(h,mi,0,0);const end=new Date(start.getTime()+me.duur*60000);
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//justPIXIT//Studio//NL','BEGIN:VEVENT',`UID:${Date.now()}@justpixit`,`DTSTAMP:${f(new Date())}`,`DTSTART;TZID=Europe/Brussels:${f(start)}`,`DTEND;TZID=Europe/Brussels:${f(end)}`,`SUMMARY:${me.titel||'Kennismaking'} - justPIXIT`,`LOCATION:${(me.locatie||'').replace(/,/g,'\\,')}`,me.videolink?`URL:${me.videolink}`:null,'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function vlProgress(){const vragen=me.vragenlijst.vragen.filter(q=>q.type!=='kop');const filled=vragen.filter(q=>{const a=vlAntwoorden()[q.id];if(Array.isArray(a))return a.length>0;return a&&String(a).trim().length>0}).length;return {filled,total:vragen.length,pct:vragen.length?Math.round(filled/vragen.length*100):0}}

    <div class="files" style="margin-top:0"><a class="btn small" href="${url}" target="_blank" rel="noopener">Open het contract (PDF)</a></div>
    <label class="fld"><span>Volledige naam</span><input id="c-naam" maxlength="120" placeholder="bv. Lotte Peeters" required></label>
    <div class="fld"><span>Handtekening</span><canvas id="sig" class="sig" width="520" height="160"></canvas><div><button type="button" class="btn ghost small" id="sigWis">Wis handtekening</button></div></div>
    <label class="chk"><input type="checkbox" id="c-akkoord"><span>Ik heb het contract gelezen en ga akkoord met de inhoud. Mijn elektronische handtekening geldt als ondertekening.</span></label>
    <div id="cmsg">${m?`<p class="${m.ok?'ok':'err'}">${esc(m.t)}</p>`:''}</div>
    <div class="actions" style="margin-top:0"><button class="btn primary" type="submit" ${busy?'disabled':''}>${busy?'Even geduld…':'Teken het contract'}</button></div></form></section>`;
}
let sigDirty=false;
function initSig(){
  const cv=$('#sig');if(!cv)return;const ctx=cv.getContext('2d');ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#474747';
  const scale=()=>{const r=cv.getBoundingClientRect();return {x:cv.width/r.width,y:cv.height/r.height,r}};
  let tekenen=false;sigDirty=false;
  const pos=e=>{const s=scale();return {x:(e.clientX-s.r.left)*s.x,y:(e.clientY-s.r.top)*s.y}};
  cv.addEventListener('pointerdown',e=>{tekenen=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);cv.setPointerCapture(e.pointerId);e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!tekenen)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();sigDirty=true;e.preventDefault()});
  cv.addEventListener('pointerup',()=>{tekenen=false});cv.addEventListener('pointercancel',()=>{tekenen=false});
  $('#sigWis').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);sigDirty=false};
}
/* ---- bijlages & traject ---- */
function renderBijlages(){
  const lab={offerte:'Offerte',factuur:'Factuur',contract:'Contract',contract_getekend:'Handtekening',ander:'Bijlage'};
  return `<section class="blok"><div class="bhead"><h2>Bijlages</h2></div><div class="card"><div class="files" style="margin-top:0">${me.bijlages.map(f=>`<a class="btn small" href="/api/dossier/${encodeURIComponent(code)}/bestand/${esc(f.id)}" target="_blank" rel="noopener">${esc(lab[f.soort]||'Bijlage')} · ${esc(f.naam)}</a>`).join('')}</div></div></section>`;
}
function renderTraject(){
  if(me.gestopt)return `<div class="card"><p style="margin:0">${esc((me.fasen.find(f=>f.k===me.fase)||{}).uitleg||'')}</p></div>`;
  return `<ol class="steps">${me.fasen.map(f=>`<li class="${f.status}"><span class="mk"></span><span class="t">${esc(f.l)}</span>${f.datum&&f.status!=='todo'?`<span class="d">${esc(fmtShort(f.datum))}</span>`:''}${f.status==='cur'?`<span class="u">${esc(f.uitleg)}</span>`:''}</li>`).join('')}</ol>`;
}
/* ---- events ---- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('#kies,#annuleerKies,#kiesIpv,#annuleerOpen,#annuleerStop,#annuleerGo,[data-day],[data-nav],[data-slot],#bevestig,[data-ofopen],[data-ofsluit],[data-ofgo]');if(!t)return;
  if(t.id==='kies'||t.id==='kiesIpv'){kiezen=true;annuleren=false;msg={};month=null;render();laadSlots();return}
  if(t.id==='annuleerKies'){kiezen=false;render();return}
  if(t.id==='annuleerOpen'){annuleren=true;kiezen=false;msg={};render();return}
  if(t.id==='annuleerStop'){annuleren=false;render();return}
  if(t.id==='annuleerGo'&&!busy){busy=true;render();try{const r=await api('/annuleer',{reden:($('#annReden')||{}).value||''});annuleren=false;await herlaad();msg={afspraak:{ok:true,t:'De afspraak is geannuleerd'+(r.gemaild?' — je krijgt een bevestiging per mail.':'.')}}}catch(err){msg.annuleer=err.message}finally{busy=false}render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.day){selDay=t.dataset.day;selSlot=null;render();if(window.innerWidth<=620){const sb=$('#slotbox');if(sb)sb.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(t.dataset.nav){const [y,m]=month.split('-').map(Number);const d=new Date(y,m-1+Number(t.dataset.nav),1);month=d.getFullYear()+'-'+pad(d.getMonth()+1);render();return}
  if(t.dataset.slot){selSlot=t.dataset.slot;render();return}
  if(t.id==='bevestig'&&selSlot&&!busy){busy=true;msg.verplaats='';render();
    try{const r=await api('/verplaats',{slot:selSlot});kiezen=false;await herlaad();msg={afspraak:{ok:true,t:'Jullie afspraak is verplaatst'+(r.gemaild?' — er is een bevestiging onderweg naar je mailbox.':'.')}}}
    catch(err){msg.verplaats=err.message;if(err.status===409){busy=false;await laadSlots();return}}
    finally{busy=false}render();window.scrollTo({top:0,behavior:'smooth'});return}
  if(t.dataset.ofopen){ofOpen={[t.dataset.of]:t.dataset.ofopen};render();const ta=$('#aftxt-'+t.dataset.of);if(ta)ta.focus();return}
  if(t.dataset.ofsluit){ofOpen={};render();return}
  if(t.dataset.ofgo&&!busy){const id=t.dataset.ofgo;busy=true;render();
    try{await api('/offerte/'+encodeURIComponent(id)+'/goedkeuren',{});ofOpen={};await herlaad();msg['of:'+id]={ok:true,t:'Bedankt! Jullie goedkeuring is doorgegeven. Ik neem snel contact op voor de volgende stap.'}}
    catch(err){msg['of:'+id]={ok:false,t:err.message}}finally{busy=false}render();const el=$('#offertes');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.dataset&&f.dataset.ofaf){e.preventDefault();if(busy)return;const id=f.dataset.ofaf;const bericht=($('#aftxt-'+id)||{}).value||'';
    if(!bericht.trim()){msg['of:'+id]={ok:false,t:'Laat even weten waarom, of wat er anders mag.'};render();return}
    busy=true;render();try{await api('/offerte/'+encodeURIComponent(id)+'/afwijzen',{bericht});ofOpen={};await herlaad();msg['of:'+id]={ok:true,t:'Bedankt voor jullie feedback — ik bekijk het en kom met een aangepast voorstel.'}}catch(err){msg['of:'+id]={ok:false,t:err.message}}finally{busy=false}render();return}
  if(f.id==='vform'){e.preventDefault();if(busy)return;
    const antw=vlAntwoorden();busy=true;render();try{await api('/vragenlijst',{antwoorden:antw,concept:false});await herlaad();msg.vragen={ok:true,t:'Bedankt! Jullie antwoorden zijn definitief doorgestuurd. Ik ga ermee aan de slag.'}}catch(err){msg.vragen={ok:false,t:err.message}}finally{busy=false}render();const el=$('#vragenlijst');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(f.id==='cform'){e.preventDefault();if(busy)return;const naam=$('#c-naam').value.trim();const akkoord=$('#c-akkoord').checked;const cv=$('#sig');
    const fout=t=>{const el=$('#cmsg');if(el)el.innerHTML=`<p class="err">${esc(t)}</p>`};
    if(naam.length<3){fout('Vul je volledige naam in.');return}
    if(!sigDirty){fout('Zet je handtekening in het vak.');return}
    if(!akkoord){fout('Vink aan dat je akkoord gaat met het contract.');return}
    const handtekening=cv.toDataURL('image/png');busy=true;render();
    try{await api('/contract/teken',{naam,akkoord,handtekening});await herlaad();msg.contract={ok:true,t:'Het contract is getekend. Bedankt!'}}catch(err){msg.contract={ok:false,t:err.message}}finally{busy=false}render();const el=$('#contract');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
});
init();
/* ---- vragenlijst: concept-knop + auto-save + progress ---- */
document.addEventListener('click',async e=>{
  if(e.target.id==='vlConcept'&&!busy){
    e.preventDefault();clearTimeout(vlTimer);const antw=vlAntwoorden();busy=true;render();
    try{await api('/vragenlijst',{antwoorden:antw,concept:true});await herlaad();msg.vragen={ok:true,t:'Jullie concept is bewaard. Je kan later terugkomen en verder aanvullen.'}}
    catch(err){msg.vragen={ok:false,t:err.message}}finally{busy=false}render();
    const el=$('#vragenlijst');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
});
document.addEventListener('input',e=>{
  if(e.target.closest('#vform')&&(e.target.dataset.vraag||e.target.type==='date')){vlUpdateProgress();vlAutoSave()}
});
document.addEventListener('change',e=>{
  if(e.target.closest('#vform')&&(e.target.type==='radio'||e.target.type==='checkbox')){vlUpdateProgress();vlAutoSave()}
});
/* file upload in vragenlijst */
document.addEventListener('click',e=>{
  const drop=e.target.closest('.vl-upload-drop');
  if(drop){drop.querySelector('input[type="file"]').click();return}
  const rm=e.target.closest('[data-vlfilerm]');
  if(rm){const qid=rm.dataset.vlfilerm;const fid=rm.dataset.fid;const cont=document.querySelector('[data-vlfiles="'+qid+'"]');
    if(cont){let files=JSON.parse(cont.dataset.vlfilesData||'[]');files=files.filter(f=>f.id!==fid);cont.dataset.vlfilesData=JSON.stringify(files);cont.innerHTML=files.map(f=>`<div class="vl-file"><span class="name">${esc(f.naam||'bestand')}</span><button type="button" class="rm" data-vlfilerm="${esc(qid)}" data-fid="${esc(f.id)}">×</button></div>`).join('');vlUpdateProgress();vlAutoSave()}return}
});
document.addEventListener('change',e=>{
  const finp=e.target.closest('.vl-upload-drop input[type="file"]');
  if(!finp)return;const drop=finp.closest('.vl-upload-drop');const qid=drop.dataset.vlupload;
  const cont=document.querySelector('[data-vlfiles="'+qid+'"]');if(!cont)return;
  const doUpload=async(file)=>{
    const r=await fetch('/api/dossier/'+encodeURIComponent(code)+'/vragenlijst/upload',{method:'POST',headers:{'Content-Type':file.type,'X-Filename':encodeURIComponent(file.name)},body:file});
    if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||'Upload mislukt')}return r.json()};
  (async()=>{
    for(const file of finp.files){
      try{const res=await doUpload(file);let files=JSON.parse(cont.dataset.vlfilesData||'[]');files.push({id:res.id,naam:file.name});cont.dataset.vlfilesData=JSON.stringify(files);
        cont.innerHTML+=`<div class="vl-file"><span class="name">${esc(file.name)}</span><button type="button" class="rm" data-vlfilerm="${esc(qid)}" data-fid="${esc(res.id)}">×</button></div>`;
      }catch(err){const p=document.createElement('p');p.className='err';p.textContent=file.name+': '+err.message;cont.appendChild(p)}
    }
    finp.value='';vlUpdateProgress();vlAutoSave()})();
});
/* drag & drop for file uploads */
document.addEventListener('dragover',e=>{const d=e.target.closest('.vl-upload-drop');if(d){e.preventDefault();d.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.vl-upload-drop');if(d)d.classList.remove('drag')});
document.addEventListener('drop',e=>{const d=e.target.closest('.vl-upload-drop');if(!d)return;e.preventDefault();d.classList.remove('drag');const finp=d.querySelector('input[type="file"]');const dt=new DataTransfer();for(const f of e.dataTransfer.files)dt.items.add(f);finp.files=dt.files;finp.dispatchEvent(new Event('change',{bubbles:true}))});
/* initial progress update after render */
const _origRender=render;render=function(){_origRender();setTimeout(vlUpdateProgress,0)};
</script>
