<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inloggen · justPIXIT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--paper:#F2F4EF;--card:#FBFBF8;--ink:#1C2A24;--ink-soft:#56655D;--green:#2C5A4C;--green-ink:#F7FAF6;--sage:#DDE7E0;--sage-deep:#C3D3C8;--line:#D2DBD3;--hair:#C8D2C9;--warn-bg:#F7E6DD;--warn-ink:#8A4B2E;--ok-bg:#E3EFE7;--ok-ink:#2C6A4C;--f-display:"Fraunces",Georgia,serif;--f-ui:"Figtree",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;padding-inline:18px;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
h1,h2,p{margin:0}button,input{font:inherit;color:inherit}
.wrap{max-width:460px;margin:auto;width:100%;padding-block:48px}
.mark{text-align:center;margin-bottom:26px}.mark .logo{font-family:var(--f-display);font-size:22px}.mark .logo b{font-weight:500}.mark .tag{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-soft)}
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:4px;box-shadow:0 1px 0 var(--hair),0 18px 40px -28px rgba(28,42,36,.4);padding:6px}.sheet-in{border:1px solid var(--line);border-radius:3px;padding:clamp(24px,5vw,40px)}
.hero{text-align:center;max-width:30rem;margin:0 auto 4px}.hero .kicker{font-family:var(--f-display);font-style:italic;color:var(--green);font-size:16px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,36px);line-height:1.1;margin-top:6px}.hero p{margin:12px auto 0;color:var(--ink-soft)}
.rule{border:0;border-top:1px solid var(--line);max-width:70px;margin:24px auto}
.login{display:grid;gap:14px}
.fld{display:grid;gap:6px}.fld>span{font-size:13.5px;color:var(--ink-soft)}
.fld input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:3px;padding:11px 13px}
.fld input:focus{outline:none;border-color:var(--green);background:var(--card);box-shadow:0 0 0 3px var(--sage)}
.btn{border:1px solid var(--line);background:var(--card);padding:13px 22px;border-radius:3px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;color:var(--ink);display:inline-block;text-align:center}
.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);color:var(--green-ink);border-color:var(--green)}.btn.primary:hover{background:#244c40}.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;color:var(--green);cursor:pointer;padding:0;font-size:13.5px;text-decoration:underline}
.err{color:var(--warn-ink);background:var(--warn-bg);padding:11px 14px;border-radius:3px;font-size:14.5px}.ok{color:var(--ok-ink);background:var(--ok-bg);padding:11px 14px;border-radius:3px;font-size:14.5px}
.note{font-size:13.5px;color:var(--ink-soft);text-align:center}
.foot{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:22px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><div class="logo">just<b>PIXIT</b></div><span class="tag">jullie persoonlijke pagina</span></div>
  <div class="sheet"><div class="sheet-in" id="main"></div></div>
  <p class="foot">justPIXIT · trouwuitnodigingen en geboortekaartjes</p>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='login';
function render(state){
  if(mode==='vergeten'){
    $('#main').innerHTML=`<div class="hero"><span class="kicker">wachtwoord vergeten</span><h1>Nieuw wachtwoord</h1><p>Vul je e-mailadres in, dan sturen we je een link om een nieuw wachtwoord in te stellen.</p></div><hr class="rule">
     <div class="login">
      ${state==='verzonden'?`<p class="ok">Als dit e-mailadres bij ons gekend is, zit er een link in je mailbox. Kijk ook even bij ongewenste mail.</p>`:`
      <form id="vergeetform" class="login" novalidate>
        <label class="fld"><span>E-mailadres</span><input id="v-email" type="email" required autocomplete="email" autofocus placeholder="naam@voorbeeld.be"></label>
        <div id="verr"></div>
        <button class="btn primary" type="submit" id="vsubmit">Stuur me een link</button>
      </form>`}
      <p class="note"><button class="linkbtn" data-mode="login">← Terug naar inloggen</button></p>
     </div>`;
    return;
  }
  $('#main').innerHTML=`<div class="hero"><span class="kicker">welkom</span><h1>Inloggen</h1><p>Meld je aan met je e-mailadres en wachtwoord.</p></div><hr class="rule">
   <form id="loginform" class="login" novalidate>
    <label class="fld"><span>E-mailadres</span><input id="l-email" type="email" required autocomplete="username" autofocus placeholder="naam@voorbeeld.be"></label>
    <label class="fld"><span>Wachtwoord</span><input id="l-pw" type="password" required autocomplete="current-password"></label>
    <div id="lerr"></div>
    <button class="btn primary" type="submit" id="lsubmit">Aanmelden</button>
    <p class="note"><button class="linkbtn" data-mode="vergeten">Wachtwoord vergeten?</button></p>
   </form>
   <hr class="rule">
   <p class="note">Nog geen klant? <a href="/afspraak" style="color:var(--green)">Plan een vrijblijvende kennismaking</a>.</p>`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-mode]');if(!t)return;mode=t.dataset.mode;render()});
document.addEventListener('submit',async e=>{
  if(e.target.id==='loginform'){e.preventDefault();const email=$('#l-email').value.trim(),pw=$('#l-pw').value;const er=$('#lerr');er.innerHTML='';
    if(!email||!pw){er.innerHTML='<p class="err">Vul je e-mailadres en wachtwoord in.</p>';return}
    const btn=$('#lsubmit');btn.disabled=true;btn.textContent='Aanmelden…';
    try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,wachtwoord:pw}),credentials:'same-origin'});const j=await r.json().catch(()=>({}));
      if(r.ok){location.href=j.redirect||'/mijn';return}er.innerHTML=`<p class="err">${esc(j.error||'Aanmelden lukte niet')}</p>`}
    catch(err){er.innerHTML='<p class="err">Geen verbinding. Probeer opnieuw.</p>'}
    btn.disabled=false;btn.textContent='Aanmelden';return}
  if(e.target.id==='vergeetform'){e.preventDefault();const email=$('#v-email').value.trim();const er=$('#verr');er.innerHTML='';
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){er.innerHTML='<p class="err">Vul een geldig e-mailadres in.</p>';return}
    const btn=$('#vsubmit');btn.disabled=true;btn.textContent='Versturen…';
    try{await fetch('/api/wachtwoord-vergeten',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email}),credentials:'same-origin'});render('verzonden')}
    catch(err){er.innerHTML='<p class="err">Geen verbinding. Probeer opnieuw.</p>';btn.disabled=false;btn.textContent='Stuur me een link'}
   }
});
render();
</script>
</body>
</html>
